<title>Manna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600&family=Sora:wght@700&display=swap">
<style>
/* Manna: coluna de app. Livro e grão: Noite, Ouro, Céu e Pergaminho, cores chapadas, Inter no app, Sora só no nome, Literata no texto bíblico. */
:root {
  --noite: #0F1B3D; --noite-dk: #070F28; --ouro: #F2C14E; --ouro-dk: #C9952B; --ceu: #A9C6E8; --pergaminho: #F5F1E6; --creme: #FDEFE2;
  --bg: #F5F1E6; --surface: #FFFCF5; --fg: #0F1B3D; --muted: #5A6278; --line: #E2DAC6; --line-dk: #CDC2A6; --soft: #ECE5D2; --mine: #FFF2CC;
  --link: #0F1B3D; --ok: #2F7044; --bad: #A23A23; --chao: rgba(15,27,61,.12);
  --deserto: #F1E3C2; --reino: #E5E6C5; --galileia: #D9E8C8; --cidades: #E8E2D5; --ceu-r: #F6E8BD;
  --estrada: #E3CFA0; --estrada-borda: #CDB37C;
  --tenda: #C98F55; --tenda-dk: #9C6634; --tronco: #8A6A44; --folha: #6E9A5A; --folha-dk: #557E45;
  --agua: #B9D5EC; --agua-dk: #7FA9CF; --areia: #E7DCBF; --nuvem: #DCE7F3; --fogo: #E0703F; --pedra: #E9E2D2; --pedra-dk: #A99E86; --parede: #FBF6EA; --telha: #B8643E;
  --monte: #CFAE84; --monte-dk: #B08E64; --ovelha: #FFFDF8; --pele: #E2B48D; --manto: #6F86B5; --manto2: #C98F55;
  --vaso: #F2C14E; --vaso-tampa: #C9952B; --vaso-tr: #0F1B3D; --bloq: #E2DBC9; --bloq-dk: #BFB497; --ouro-ink: #7A5A10;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-logo: 'Sora', 'Inter', system-ui, sans-serif;
  --f-book: 'Literata', Georgia, 'Times New Roman', serif;
  --pill: 999px; --gut: max(16px, env(safe-area-inset-left, 0px)); --gutr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1B3D; --surface: #16244B; --fg: #F5F1E6; --muted: #A8B2CA; --line: #283A66; --line-dk: #34487A; --soft: #1D2D58; --mine: #273A6E;
    --link: #A9C6E8; --ok: #8FD3A1; --bad: #F5A28C; --chao: rgba(0,0,0,.28);
    --deserto: #1F2C55; --reino: #1E3050; --galileia: #1B3249; --cidades: #222B4D; --ceu-r: #2B3152; --estrada: #3A4C7A; --estrada-borda: #2C3B66;
    --bloq: #22335F; --bloq-dk: #34487A; --vaso-tr: #070F28; --ouro-ink: #F2C14E; color-scheme: dark;
  }
}
/* Base */
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; scroll-padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
html, body { min-height: 100%; }
body.ov-open { overflow: hidden; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
#app { max-width: 520px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gutr); padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
body.in-lesson #app { padding-bottom: 0; }
h1, h2, h3, p, ol, ul, figure, blockquote { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.22; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--ceu); outline-offset: 2px; }
img { max-width: 100%; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: 13px; line-height: 1.45; }
.small { font-size: 14px; }
.center-t { text-align: center; }
.err { color: var(--bad); font-size: 14px; }
.empty, .lede { color: var(--muted); }
.body-l { font-size: 17px; }
.h1, .qt { font: 800 26px/1.18 var(--f-body); letter-spacing: -0.02em; }
.h2 { font: 800 19px/1.25 var(--f-body); }
.brand { font: 700 24px/1 var(--f-logo); letter-spacing: -0.03em; }
.brand.sm { font-size: 18px; }
.grp { font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 4px; }
.ref { font-weight: 600; color: var(--muted); }
.code { font-family: ui-monospace, monospace; letter-spacing: .08em; }
.screen { display: flex; flex-direction: column; gap: 18px; padding: 16px 0 28px; }
.sheet-top { padding-top: 0; }
.center-col { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 130px; width: auto; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Ícones e marcas */
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; } .ic.xs { width: 14px; height: 14px; stroke-width: 3; } .ic.lg { width: 32px; height: 32px; }
.ic.flip { transform: rotate(180deg); } .ic.down { transform: rotate(-90deg); }
.flip .ic { transform: rotate(180deg); }
.grao { width: 14px; height: 18px; fill: var(--ouro); flex: none; }
.grao.lg { width: 28px; height: 38px; }
.vaso { width: 22px; height: 25px; flex: none; } .vaso.xs { width: 14px; height: 16px; }
.logo { width: 28px; height: 28px; display: block; flex: none; } .logo.sm { width: 26px; height: 26px; } .logo.md { width: 34px; height: 34px; }
.escudo { width: 32px; height: 37px; display: block; } .escudo.big { width: 60px; height: 69px; }
.medalha { width: 46px; height: 52px; display: block; }
.deco { display: block; width: 100%; height: 100%; }

/* Botões */
.btn { display: inline-flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 13px 22px; border: 0; border-radius: var(--pill); background: var(--ouro); color: var(--noite); font: 700 16px/1.2 var(--f-body); text-decoration: none; text-align: center; transition: transform .12s ease; }
.btn .ic { width: 18px; height: 18px; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { background: var(--soft); color: var(--muted); cursor: default; }
.btn.sec { background: transparent; color: var(--fg); border: 1.5px solid var(--fg); }
.btn.ghost { background: transparent; color: var(--fg); }
.btn.mini { width: auto; min-height: 44px; padding: 8px 16px; font-size: 14px; }
.btn.mini.off { background: var(--soft); color: var(--muted); }
.btn.badbtn { background: var(--bad); color: var(--bg); }
.btn.sec-dark { background: transparent; color: var(--pergaminho); border: 1.5px solid rgba(245,241,230,.5); }
.link { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.link.danger { color: var(--bad); align-self: center; display: inline-flex; align-items: center; min-height: 44px; padding: 8px 12px; }
.iconbtn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--muted); flex: none; }
.busy { display: flex; flex-direction: column; gap: 8px; }
.sticky-cta { position: sticky; bottom: 0; z-index: 3; display: flex; flex-direction: column; gap: 8px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
.pill { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--line); border-radius: var(--pill); background: var(--surface); padding: 8px 14px; font-size: 14px; font-weight: 600; }
.pill.on { background: var(--noite); color: var(--ouro); border-color: var(--noite); }
.mini-i { min-width: 44px; height: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-weight: 700; font-size: 13px; color: var(--muted); }
.mini-i:disabled { opacity: .4; }

/* Progresso */
.line { display: block; height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; flex: 1; }
.line i { display: block; height: 100%; background: var(--fg); border-radius: 4px; }
.line.on-dark { background: rgba(245,241,230,.16); } .line.on-dark i { background: var(--ouro); }
.bar { display: block; height: 6px; border-radius: 6px; background: var(--soft); overflow: hidden; flex: 1; min-width: 40px; }
.bar i { display: block; height: 100%; background: var(--fg); border-radius: 6px; }
.segs { display: flex; gap: 4px; }
.segs i { flex: 1; height: 4px; border-radius: 4px; background: var(--soft); }
.segs i.on { background: var(--fg); } .segs i.now { background: var(--ouro-ink); }
@media (prefers-reduced-motion: no-preference) { .bar i, .line i { transition: width .5s ease; } }

/* Cartões, listas e notas */
.card { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.card h3 { font: 700 16px/1.3 var(--f-body); }
.card.test { border-style: dashed; }
.note { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: var(--soft); font-size: 15px; }
.note.warn { background: var(--mine); }
.sec:not(.btn) { display: flex; flex-direction: column; gap: 10px; }
.sec > h2, .sec-h h2 { font: 800 18px/1.3 var(--f-body); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.list { list-style: none; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.list button { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 14px 16px; border: 0; background: none; text-align: left; }
.list button b { font-weight: 700; }
.list .muted { font-size: 14px; }
.list .dq { flex-direction: row; align-items: center; gap: 12px; }
.list .dq b { flex: 1; min-width: 0; }
.dq-dot { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-dk); display: grid; place-items: center; }
.dq-dot.on { background: var(--noite); border-color: var(--noite); color: var(--ouro); }
.xp-tag { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.dots, .roteiro { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.row-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); text-align: left; }
.row-link span { display: flex; flex-direction: column; min-width: 0; }
.row-link small { color: var(--muted); }
.insight { color: var(--muted); font-size: 15px; }

/* Formulários */
.form { display: flex; flex-direction: column; gap: 12px; }
.form label, .field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; min-width: 0; }
.form input, .form textarea, .form select, .search, .field textarea, .intro textarea, .ask textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font: 400 16px/1.45 var(--f-body); }
.form.card input, .form.card textarea, .form.card select { background: var(--bg); }
textarea { resize: vertical; }
.form.inline { flex-direction: row; gap: 8px; margin-top: 8px; }
.form.inline input { flex: 1; min-width: 0; }
.form .file input { padding: 10px; font-size: 14px; }
.check, .form label.check { display: flex; flex-direction: row; align-items: center; gap: 12px; font-weight: 600; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--noite); }
.check.big { padding: 12px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.ask { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.seg { display: flex; padding: 4px; gap: 4px; border-radius: var(--pill); background: var(--soft); }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: var(--pill); background: transparent; font-weight: 700; color: var(--muted); }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--noite); color: var(--pergaminho); }
.seg.small button { min-height: 36px; font-size: 14px; }

/* Topo das abas (faixa Noite) */
.capa { margin-inline: calc(-1 * var(--gut)) calc(-1 * var(--gutr)); background: var(--noite); color: var(--pergaminho); padding: 16px var(--gutr) 22px var(--gut); border-radius: 0 0 24px 24px; }
.capa-in { display: flex; flex-direction: column; gap: 4px; }
.capa-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
@media (max-width: 420px) {
  .capa .pills { width: 100%; justify-content: flex-end; }
}
.capa .brand { color: var(--ouro); }
.capa-t { font: 800 26px/1.15 var(--f-body); letter-spacing: -0.02em; }
.capa-s { color: rgba(245,241,230,.72); font-size: 15px; }
.pills { display: flex; gap: 6px; flex: none; }
.spill { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; padding: 8px 12px; border-radius: var(--pill); border: 1px solid rgba(245,241,230,.22); background: transparent; color: var(--pergaminho); font-size: 13px; }
.spill b { font-weight: 800; font-size: 15px; }
.spill .grao { width: 11px; height: 15px; fill: rgba(245,241,230,.45); }
.spill.lit .grao { fill: var(--ouro); }

/* Jornada: topo curto */
.topo-j { margin-inline: calc(-1 * var(--gut)) calc(-1 * var(--gutr)); background: var(--noite); color: var(--pergaminho); padding: 16px var(--gutr) 14px var(--gut); border-radius: 0 0 22px 22px; display: flex; flex-direction: column; gap: 12px; }
.tj-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
@media (max-width: 420px) {
  .trail-chip { flex: 1 1 100%; }
  .pills { width: 100%; justify-content: flex-end; }
}
.trail-chip { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 12px 4px 4px; border: 0; border-radius: var(--pill); background: rgba(245,241,230,.08); color: var(--pergaminho); text-align: left; }
.trail-chip span { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.trail-chip b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trail-chip small { font-size: 12px; color: rgba(245,241,230,.65); }
.trail-chip .logo { border-radius: 50%; }
.hoje { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 18px; background: rgba(245,241,230,.08); }
.hoje > div { display: flex; flex-direction: column; min-width: 0; }
.hoje small { color: rgba(245,241,230,.7); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hoje b { font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.hoje .btn { flex: none; }
.xp-row { display: flex; align-items: center; gap: 10px; }
.xp-row small { font-size: 12px; color: rgba(245,241,230,.7); white-space: nowrap; }
.screen.jornada { padding-top: 8px; gap: 14px; }

/* Mapa da caminhada */
.mapa { position: relative; margin: 0 auto; max-width: 100%; overflow: hidden; }
.mapa-svg { position: absolute; inset: 0; display: block; }
.rg.deserto { fill: var(--deserto); } .rg.reino { fill: var(--reino); } .rg.galileia { fill: var(--galileia); } .rg.cidades { fill: var(--cidades); } .rg.ceu { fill: var(--ceu-r); }
.estrada-borda { fill: none; stroke: var(--estrada-borda); stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
.estrada { fill: none; stroke: var(--estrada); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
.estrada-meio { fill: none; stroke: var(--surface); stroke-width: 2.5; stroke-dasharray: 2 10; stroke-linecap: round; opacity: .9; }
.estrada-feita { fill: none; stroke: var(--ouro); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
.marco { position: absolute; z-index: 2; transform: translate(-50%, -50%); border: 0; background: none; padding: 0; display: grid; place-items: center; }
.m-dot { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); border: 2px solid var(--estrada-borda); color: var(--muted); }
.m-dot i { font: 700 14px/1 var(--f-body); font-style: normal; }
.marco.done .m-dot, .m-dot.aqui { background: var(--ouro); border-color: var(--ouro-dk); color: var(--noite); }
.marco.done .m-dot .ic { width: 16px; height: 16px; stroke-width: 3.5; }
.marco.cur { z-index: 3; }
.m-lbl { position: absolute; z-index: 1; display: flex; flex-direction: column; gap: 1px; max-width: 46%; padding: 5px 9px; border-radius: 10px; background: var(--surface); font-size: 13px; line-height: 1.3; pointer-events: none; }
.m-lbl.dir { transform: translate(28px, -50%); text-align: left; }
.m-lbl.esq { transform: translate(-28px, -50%); text-align: right; align-items: flex-end; }
.m-lbl.cur.dir { transform: translate(42px, -50%); } .m-lbl.cur.esq { transform: translate(-42px, -50%); }
.m-lbl b { font-weight: 700; font-size: 14px; }
.m-lbl small { color: var(--muted); font-size: 12px; }
.m-lbl em { font-style: normal; font-weight: 800; font-size: 12px; color: var(--ouro-ink); }
.m-lbl.lock { background: transparent; } .m-lbl.lock b { color: var(--muted); font-weight: 600; }
.camp { position: absolute; z-index: 2; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; max-width: 78%; padding: 6px 16px; border-radius: 14px; background: var(--noite); color: var(--pergaminho); text-align: center; }
.camp b { font-size: 13px; font-weight: 800; color: var(--ouro); }
.camp small { font-size: 12px; color: rgba(245,241,230,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.m-nota { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); transform: translateY(-50%); }
.m-vaso { width: 30px; height: 34px; display: block; }
.marco.vasoM { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); border: 2px solid var(--estrada-borda); }
.marco.vasoM.ready { border-color: var(--ouro-dk); background: var(--mine); }
.marco.vasoM.lock .m-vaso { opacity: .45; filter: grayscale(1); }
.marco.vasoM.opened { opacity: .6; }
.destino { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; margin: 16px 0 6px; padding: 16px; text-align: center; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.destino b { font-size: 17px; overflow-wrap: anywhere; } .destino small { color: var(--muted); }
.destino .btn { margin-top: 8px; }
.mani-mapa { position: absolute; z-index: 4; width: 48px; height: 48px; margin: 0; pointer-events: none; transform: translate(-50%, -100%); }
.mani-mapa img { display: block; width: 48px; height: 48px; min-height: 48px; object-fit: contain; transform: none; }
.mani-mapa.espera { visibility: hidden; }

/* Desafios de hoje */
.tarefas { display: flex; flex-direction: column; gap: 6px; }
.boost { font-size: 13px; font-weight: 700; color: var(--muted); }
.tarefas ul { list-style: none; padding: 0; border-top: 1px solid var(--line); }
.tarefas li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tk { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-dk); display: grid; place-items: center; }
.tarefas li.ok .tk { background: var(--noite); border-color: var(--noite); color: var(--ouro); }
.tt { flex: 1; min-width: 0; font-size: 15px; }
.tarefas li.ok .tt { color: var(--muted); }

/* Mani */
.mani { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none; }
.m-tile { display: block; background: transparent; padding: 0; line-height: 0; }
.m-tile img { display: block; width: auto; height: 72px; min-height: 48px; max-width: 100%; transform: none; }
.m-sm .m-tile img { height: 72px; }
.m-md .m-tile img { height: 112px; }
.m-lg .m-tile img { height: 160px; }
.m-hero .m-tile img { height: min(180px, 42vw); min-height: 96px; }
.m-fala { position: relative; margin: 0; padding: 8px 12px; border-radius: 16px; background: #fff; color: #0F1B3D; border: 1px solid #E2DAC6; font-size: 15px; font-weight: 600; line-height: 1.35; text-align: center; max-width: 34ch; }
.mani.row .m-fala { text-align: left; }
.mani-slot { display: flex; justify-content: flex-start; }
body.ov-open .topo-j .mani, body.ov-open .screen .mani, body.ov-open .onb-mid .mani { visibility: hidden; }
.mani.row { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 14px; max-width: 100%; }
.topo-j .m-fala { max-width: 24ch; }
.mani.row .m-fala { text-align: left; }
