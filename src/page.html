<title>Manna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
/* Coluna de app de celular, centrada. Cores chapadas da marca, sem degradê nem brilho. */
:root {
  --noite: #0F1B3D; --ouro: #F2C14E; --ceu: #A9C6E8; --pergaminho: #F5F1E6;
  --bg: #F5F1E6; --surface: #FFFCF5; --fg: #0F1B3D; --muted: #5A6278; --line: #DED6C3; --soft: #EBE4D2;
  --link: #0F1B3D; --accent: #F2C14E; --on-accent: #0F1B3D; --danger: #9E3A24; --mine: #FFF4D6;
  --f-brand: 'Sora', 'Inter', system-ui, sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1B3D; --surface: #15234A; --fg: #F5F1E6; --muted: #A8B2CA; --line: #283A66; --soft: #1D2D58;
    --link: #A9C6E8; --danger: #F0937D; --mine: #1F2F5C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1B3D; --surface: #15234A; --fg: #F5F1E6; --muted: #A8B2CA; --line: #283A66; --soft: #1D2D58;
  --link: #A9C6E8; --danger: #F0937D; --mine: #1F2F5C; color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
#app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3, p, ol, ul { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.25; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ceu); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: 13px; line-height: 1.45; }
.center-t { text-align: center; }
.screen { display: flex; flex-direction: column; gap: 16px; padding-block: 16px 24px; }
.screen.center { align-items: stretch; text-align: center; padding-top: 40px; }
.h1 { font: 700 26px/1.2 var(--f-brand); letter-spacing: -0.01em; }
.qt { font: 700 23px/1.25 var(--f-brand); letter-spacing: -0.01em; }
.body-l { font-size: 17px; }
.brand { font: 700 44px/1 var(--f-brand); letter-spacing: -0.03em; }
.brand.sm { font-size: 20px; }
.lead { font-size: 18px; color: var(--muted); }
.hero { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 24px 8px; }
.logo { width: 30px; height: 30px; display: block; flex: none; }
.logo.big { width: 96px; height: 96px; }
.grao { width: 14px; height: 18px; fill: var(--ouro); flex: none; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 12px 18px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; text-align: center; }
.btn:disabled { opacity: .6; cursor: default; }
.btn.sec { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--fg); }
.btn.sm { min-height: 40px; width: auto; padding: 8px 14px; font-size: 15px; }
.btn.danger-btn { background: var(--danger); color: var(--bg); }
.link { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.link.danger { color: var(--danger); align-self: center; padding: 8px; }
.iconbtn { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 0; border-radius: 10px; background: transparent; margin-left: -8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; width: auto; }
.busy { display: flex; flex-direction: column; gap: 8px; }
.sticky-cta { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); margin-top: 4px; }

/* Quiz */
.qhead { display: flex; align-items: center; gap: 12px; }
.qhead .bar { flex: 1; }
.bar { display: block; height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 54px; padding: 12px 16px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-weight: 500; }
.opt span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt small { color: var(--muted); font-weight: 400; font-size: 14px; }
.opt.on { border: 2px solid var(--fg); padding: 11px 15px; background: var(--soft); }
.ord { font-style: normal; font-weight: 700; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.grp { font-size: 15px; color: var(--muted); font-weight: 600; margin-top: 6px; }
.plan strong { font-size: 15px; white-space: nowrap; }
.tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 600; vertical-align: 2px; }
.checks { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.timeline { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); font-size: 15px; }
.metas { padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.metas li span { display: block; font-size: 14px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { font-size: 16px; font-weight: 600; }
.card h2 { font: 700 20px/1.25 var(--f-brand); }
.kicker { color: var(--muted); font-size: 14px; }
.ref { font-weight: 600; }
.ref.big { font: 700 20px/1.3 var(--f-brand); }
.porcao { padding: 20px; gap: 12px; }
.porcao.done h2 { font-size: 19px; }
.row-card { flex-direction: row; align-items: center; justify-content: space-between; cursor: pointer; }
.row-card > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.chev { font-size: 28px; color: var(--muted); line-height: 1; }
.note { padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 15px; }
.risk { font-weight: 600; color: var(--danger); }
.err { color: var(--danger); font-size: 14px; }
.insight { color: var(--muted); font-size: 15px; }

/* Topo */
.top { display: flex; align-items: center; justify-content: space-between; padding-top: 12px; }
.mark { display: flex; align-items: center; gap: 8px; }
.streak { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }
.streak b { font: 700 17px/1 var(--f-brand); }
.streak span { font-size: 14px; color: var(--muted); }

/* Seções */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec > h2, .sec-h h2 { font-size: 18px; font-weight: 700; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.meta { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: left; }
.meta-t { display: flex; justify-content: space-between; gap: 8px; }
.stats3, .stats2 { display: grid; gap: 10px; }
.stats3 { grid-template-columns: repeat(3, 1fr); }
.stats2 { grid-template-columns: repeat(2, 1fr); }
.stats3 div, .stats2 div { display: flex; flex-direction: column; gap: 2px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; }
.stats3 b, .stats2 b { font: 700 26px/1.1 var(--f-brand); }
.stats3 span, .stats2 span { font-size: 13px; color: var(--muted); line-height: 1.3; }
.stats2 small { font-size: 12px; }

/* Abas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs button { flex: 1; max-width: 96px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; border-radius: 10px; }
.tabs button[aria-current] { color: var(--fg); font-weight: 700; }
.tabs button[aria-current] .ic { stroke-width: 2.3; }
.tabs button[aria-current] span { box-shadow: inset 0 -2px 0 var(--accent); }

/* Formulários */
.form { display: flex; flex-direction: column; gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; min-width: 0; }
.form input, .form textarea, .form select, .search, .lesson textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-weight: 400; font-size: 16px; }
.form textarea, .lesson textarea { resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form.inline { flex-direction: row; gap: 8px; margin-top: 8px; }
.form.inline input { flex: 1; min-width: 0; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 600; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--noite); }
.ask { padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.seg { display: flex; padding: 4px; gap: 4px; border-radius: 12px; background: var(--soft); }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; color: var(--muted); }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }

/* Listas */
.list { list-style: none; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.list button { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 14px 16px; border: 0; background: none; text-align: left; }
.list button b { font-weight: 600; }
.list .muted { font-size: 14px; }
.list .empty { padding: 16px; color: var(--muted); }
.lessons, .days, .ach, .rank, .feed { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.lessons li > * { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-align: left; }
.lessons li > * > span:last-child { display: flex; flex-direction: column; min-width: 0; }
.lessons .n { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--soft); font-weight: 600; font-size: 14px; }
.lessons .feita .n { background: var(--fg); color: var(--bg); }
.lessons .next > * { border: 2px solid var(--fg); padding: 11px 13px; }
.lessons .next .n { background: var(--accent); color: var(--on-accent); }
.lessons li:not(.feita):not(.next) { opacity: .7; }
.days li { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.days li.feita { background: var(--soft); }
.dots { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.roteiro { padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.ach { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ach li { padding: 12px; border: 1px dashed var(--line); border-radius: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ach li span { font-size: 13px; }
.ach li:not(.got) b { color: var(--muted); }
.ach li.got { border-style: solid; background: var(--surface); }
.rank li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.rank .pos { width: 22px; color: var(--muted); font-weight: 600; }
.rank .nm { flex: 1; min-width: 0; }
.rank b { font: 700 18px/1 var(--f-brand); }
.rank li.me { border: 2px solid var(--fg); padding: 9px 13px; background: var(--mine); }
.feed li { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; overflow-wrap: anywhere; }
.acts { display: flex; align-items: center; gap: 16px; }
.pill { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 4px 12px; font-size: 14px; font-weight: 500; }
.pill.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.cmts { list-style: none; padding: 8px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.code { font-family: ui-monospace, monospace; letter-spacing: .08em; color: var(--fg); }
.trad { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.trad.mine { border: 2px solid var(--fg); padding: 13px 15px; background: var(--mine); }
.pastor { padding: 16px; border-radius: var(--r); background: var(--noite); color: var(--pergaminho); display: flex; flex-direction: column; gap: 6px; }
.pastor h3 { color: var(--ouro); font-size: 17px; }
.ai-out { display: flex; flex-direction: column; gap: 8px; }

/* Cartão compartilhável */
.share { border: 1px solid var(--line); background: var(--noite); color: var(--pergaminho); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.share .brand { color: var(--ouro); }
.share h2 { font: 700 22px/1.2 var(--f-brand); }
.share-n { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.share-n div { display: flex; flex-direction: column; }
.share-n b { font: 700 30px/1.1 var(--f-brand); color: var(--ouro); }
.share-n span { font-size: 13px; opacity: .85; }
.share > p:last-child { font-size: 14px; opacity: .85; }

/* Tela sobreposta */
.ovh { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; display: flex; align-items: center; gap: 6px; padding-block: 8px; background: var(--bg); font-weight: 600; color: var(--muted); font-size: 15px; }
.big-streak { display: flex; align-items: center; justify-content: center; gap: 10px; }
.big-streak .grao { width: 34px; height: 44px; }
.big-streak b { font: 700 64px/1 var(--f-brand); }
.test { border-style: dashed; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: min(440px, calc(100% - 32px)); padding: 12px 16px; border-radius: 12px; background: var(--fg); color: var(--bg); font-size: 15px; font-weight: 500; text-align: center; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .4s ease; } }
@media (max-width: 360px) { .two { grid-template-columns: 1fr; } .stats3 b { font-size: 22px; } }
</style>
<div id="app"></div>
