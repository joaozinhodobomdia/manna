<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1B3D">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Manna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600&family=Sora:wght@700&display=swap">
<style>
/* Manna: coluna de app. Livro e grão: Noite, Ouro, Céu e Pergaminho, cores chapadas, Inter no app, Sora só no nome, Literata no texto bíblico. */
:root {
  --noite: #0F1B3D; --noite-dk: #070F28; --ouro: #F2C14E; --ouro-dk: #C9952B; --ceu: #A9C6E8; --pergaminho: #F5F1E6; --creme: #FDEFE2;
  --bg: #F5F1E6; --surface: #FFFCF5; --fg: #0F1B3D; --muted: #5A6278; --line: #E2DAC6; --line-dk: #CDC2A6; --soft: #ECE5D2; --mine: #FFF2CC;
  --link: #0F1B3D; --ok: #2F7044; --bad: #A23A23; --chao: rgba(15,27,61,.12);
  --deserto: #F1E3C2; --reino: #E5E6C5; --galileia: #D9E8C8; --cidades: #E8E2D5; --ceu-r: #F6E8BD;
  --estrada: #E3CFA0; --estrada-borda: #CDB37C;
  --tenda: #C98F55; --tenda-dk: #9C6634; --tronco: #8A6A44; --folha: #6E9A5A; --folha-dk: #557E45;
  --agua: #B9D5EC; --agua-dk: #7FA9CF; --areia: #E7DCBF; --nuvem: #DCE7F3; --fogo: #E0703F; --pedra: #E9E2D2; --pedra-dk: #A99E86; --parede: #FBF6EA; --telha: #B8643E;
  --monte: #CFAE84; --monte-dk: #B08E64; --ovelha: #FFFDF8; --pele: #E2B48D; --manto: #6F86B5; --manto2: #C98F55;
  --vaso: #F2C14E; --vaso-tampa: #C9952B; --vaso-tr: #0F1B3D; --bloq: #E2DBC9; --bloq-dk: #BFB497; --ouro-ink: #7A5A10;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-logo: 'Sora', 'Inter', system-ui, sans-serif;
  --f-book: 'Literata', Georgia, 'Times New Roman', serif;
  --pill: 999px; --gut: max(16px, env(safe-area-inset-left, 0px)); --gutr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1B3D; --surface: #16244B; --fg: #F5F1E6; --muted: #A8B2CA; --line: #283A66; --line-dk: #34487A; --soft: #1D2D58; --mine: #273A6E;
    --link: #A9C6E8; --ok: #8FD3A1; --bad: #F5A28C; --chao: rgba(0,0,0,.28);
    --deserto: #1F2C55; --reino: #1E3050; --galileia: #1B3249; --cidades: #222B4D; --ceu-r: #2B3152; --estrada: #3A4C7A; --estrada-borda: #2C3B66;
    --bloq: #22335F; --bloq-dk: #34487A; --vaso-tr: #070F28; --ouro-ink: #F2C14E; color-scheme: dark;
  }
}
/* Base */
* { box-sizing: border-box; }
html { scroll-padding-top: 16px; scroll-padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
html, body { min-height: 100%; }
body.ov-open { overflow: hidden; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
#app { max-width: 520px; margin: 0 auto; padding-left: var(--gut); padding-right: var(--gutr); padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
body.in-lesson #app { padding-bottom: 0; }
h1, h2, h3, p, ol, ul, figure, blockquote { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.22; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--ceu); outline-offset: 2px; }
img { max-width: 100%; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: 13px; line-height: 1.45; }
.small { font-size: 14px; }
.center-t { text-align: center; }
.err { color: var(--bad); font-size: 14px; }
.empty, .lede { color: var(--muted); }
.body-l { font-size: 17px; }
.h1, .qt { font: 800 26px/1.18 var(--f-body); letter-spacing: -0.02em; }
.h2 { font: 800 19px/1.25 var(--f-body); }
.brand { font: 700 24px/1 var(--f-logo); letter-spacing: -0.03em; }
.brand.sm { font-size: 18px; }
.grp { font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 4px; }
.ref { font-weight: 600; color: var(--muted); }
.code { font-family: ui-monospace, monospace; letter-spacing: .08em; }
.screen { display: flex; flex-direction: column; gap: 18px; padding: 16px 0 28px; }
.sheet-top { padding-top: 0; }
.center-col { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 130px; width: auto; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Ícones e marcas */
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; } .ic.xs { width: 14px; height: 14px; stroke-width: 3; } .ic.lg { width: 32px; height: 32px; }
.ic.flip { transform: rotate(180deg); } .ic.down { transform: rotate(-90deg); }
.flip .ic { transform: rotate(180deg); }
.grao { width: 14px; height: 18px; fill: var(--ouro); flex: none; }
.grao.lg { width: 28px; height: 38px; }
.vaso { width: 22px; height: 25px; flex: none; } .vaso.xs { width: 14px; height: 16px; }
.logo { width: 28px; height: 28px; display: block; flex: none; } .logo.sm { width: 26px; height: 26px; } .logo.md { width: 34px; height: 34px; }
.escudo { width: 32px; height: 37px; display: block; } .escudo.big { width: 60px; height: 69px; }
.medalha { width: 46px; height: 52px; display: block; }
.deco { display: block; width: 100%; height: 100%; }

/* Botões */
.btn { display: inline-flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 13px 22px; border: 0; border-radius: var(--pill); background: var(--ouro); color: var(--noite); font: 700 16px/1.2 var(--f-body); text-decoration: none; text-align: center; transition: transform .12s ease; }
.btn .ic { width: 18px; height: 18px; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { background: var(--soft); color: var(--muted); cursor: default; }
.btn.sec { background: transparent; color: var(--fg); border: 1.5px solid var(--fg); }
.btn.ghost { background: transparent; color: var(--fg); }
.btn.mini { width: auto; min-height: 44px; padding: 8px 16px; font-size: 14px; }
.btn.mini.off { background: var(--soft); color: var(--muted); }
.btn.badbtn { background: var(--bad); color: var(--bg); }
.btn.sec-dark { background: transparent; color: var(--pergaminho); border: 1.5px solid rgba(245,241,230,.5); }
.link { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.link.danger { color: var(--bad); align-self: center; display: inline-flex; align-items: center; min-height: 44px; padding: 8px 12px; }
.iconbtn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; border-radius: 12px; background: transparent; color: var(--muted); flex: none; }
.busy { display: flex; flex-direction: column; gap: 8px; }
.sticky-cta { position: sticky; bottom: 0; z-index: 3; display: flex; flex-direction: column; gap: 8px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
.pill { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--line); border-radius: var(--pill); background: var(--surface); padding: 8px 14px; font-size: 14px; font-weight: 600; }
.pill.on { background: var(--noite); color: var(--ouro); border-color: var(--noite); }
.mini-i { min-width: 44px; height: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-weight: 700; font-size: 13px; color: var(--muted); }
.mini-i:disabled { opacity: .4; }

/* Progresso */
.line { display: block; height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; flex: 1; }
.line i { display: block; height: 100%; background: var(--fg); border-radius: 4px; }
.line.on-dark { background: rgba(245,241,230,.16); } .line.on-dark i { background: var(--ouro); }
.bar { display: block; height: 6px; border-radius: 6px; background: var(--soft); overflow: hidden; flex: 1; min-width: 40px; }
.bar i { display: block; height: 100%; background: var(--fg); border-radius: 6px; }
.segs { display: flex; gap: 4px; }
.segs i { flex: 1; height: 4px; border-radius: 4px; background: var(--soft); }
.segs i.on { background: var(--fg); } .segs i.now { background: var(--ouro-ink); }
@media (prefers-reduced-motion: no-preference) { .bar i, .line i { transition: width .5s ease; } }

/* Cartões, listas e notas */
.card { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.card h3 { font: 700 16px/1.3 var(--f-body); }
.card.test { border-style: dashed; }
.note { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: var(--soft); font-size: 15px; }
.note.warn { background: var(--mine); }
.sec:not(.btn) { display: flex; flex-direction: column; gap: 10px; }
.sec > h2, .sec-h h2 { font: 800 18px/1.3 var(--f-body); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.list { list-style: none; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.list button { display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 14px 16px; border: 0; background: none; text-align: left; }
.list button b { font-weight: 700; }
.list .muted { font-size: 14px; }
.list .dq { flex-direction: row; align-items: center; gap: 12px; }
.list .dq b { flex: 1; min-width: 0; }
.dq-dot { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-dk); display: grid; place-items: center; }
.dq-dot.on { background: var(--noite); border-color: var(--noite); color: var(--ouro); }
.xp-tag { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.dots, .roteiro { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.row-link { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); text-align: left; }
.row-link span { display: flex; flex-direction: column; min-width: 0; }
.row-link small { color: var(--muted); }
.insight { color: var(--muted); font-size: 15px; }

/* Formulários */
.form { display: flex; flex-direction: column; gap: 12px; }
.form label, .field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; min-width: 0; }
.form input, .form textarea, .form select, .search, .field textarea, .intro textarea, .ask textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font: 400 16px/1.45 var(--f-body); }
.form.card input, .form.card textarea, .form.card select { background: var(--bg); }
textarea { resize: vertical; }
.form.inline { flex-direction: row; gap: 8px; margin-top: 8px; }
.form.inline input { flex: 1; min-width: 0; }
.form .file input { padding: 10px; font-size: 14px; }
.check, .form label.check { display: flex; flex-direction: row; align-items: center; gap: 12px; font-weight: 600; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--noite); }
.check.big { padding: 12px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.ask { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
.seg { display: flex; padding: 4px; gap: 4px; border-radius: var(--pill); background: var(--soft); }
.seg button { flex: 1; min-height: 40px; border: 0; border-radius: var(--pill); background: transparent; font-weight: 700; color: var(--muted); }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--noite); color: var(--pergaminho); }
.seg.small button { min-height: 36px; font-size: 14px; }

/* Topo das abas (faixa Noite) */
.capa { margin-inline: calc(-1 * var(--gut)) calc(-1 * var(--gutr)); background: var(--noite); color: var(--pergaminho); padding: 16px var(--gutr) 22px var(--gut); border-radius: 0 0 24px 24px; }
.capa-in { display: flex; flex-direction: column; gap: 4px; }
.capa-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
@media (max-width: 420px) {
  .capa .pills { width: 100%; justify-content: flex-end; }
}
.capa .brand { color: var(--ouro); }
.capa-t { font: 800 26px/1.15 var(--f-body); letter-spacing: -0.02em; }
.capa-s { color: rgba(245,241,230,.72); font-size: 15px; }
.pills { display: flex; gap: 6px; flex: none; }
.spill { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; padding: 8px 12px; border-radius: var(--pill); border: 1px solid rgba(245,241,230,.22); background: transparent; color: var(--pergaminho); font-size: 13px; }
.spill b { font-weight: 800; font-size: 15px; }
.spill .grao { width: 11px; height: 15px; fill: rgba(245,241,230,.45); }
.spill.lit .grao { fill: var(--ouro); }

/* Jornada: topo curto */
.topo-j { margin-inline: calc(-1 * var(--gut)) calc(-1 * var(--gutr)); background: var(--noite); color: var(--pergaminho); padding: 16px var(--gutr) 14px var(--gut); border-radius: 0 0 22px 22px; display: flex; flex-direction: column; gap: 12px; }
.tj-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
@media (max-width: 420px) {
  .trail-chip { flex: 1 1 100%; }
  .pills { width: 100%; justify-content: flex-end; }
}
.trail-chip { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 12px 4px 4px; border: 0; border-radius: var(--pill); background: rgba(245,241,230,.08); color: var(--pergaminho); text-align: left; }
.trail-chip span { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.trail-chip b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trail-chip small { font-size: 12px; color: rgba(245,241,230,.65); }
.trail-chip .logo { border-radius: 50%; }
.hoje { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 18px; background: rgba(245,241,230,.08); }
.hoje > div { display: flex; flex-direction: column; min-width: 0; }
.hoje small { color: rgba(245,241,230,.7); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hoje b { font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.hoje .btn { flex: none; }
.xp-row { display: flex; align-items: center; gap: 10px; }
.xp-row small { font-size: 12px; color: rgba(245,241,230,.7); white-space: nowrap; }
.screen.jornada { padding-top: 8px; gap: 14px; }

/* Mapa da caminhada */
.mapa { position: relative; margin: 0 auto; max-width: 100%; overflow: hidden; }
.mapa-svg { position: absolute; inset: 0; display: block; }
.rg.deserto { fill: var(--deserto); } .rg.reino { fill: var(--reino); } .rg.galileia { fill: var(--galileia); } .rg.cidades { fill: var(--cidades); } .rg.ceu { fill: var(--ceu-r); }
.estrada-borda { fill: none; stroke: var(--estrada-borda); stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; }
.estrada { fill: none; stroke: var(--estrada); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
.estrada-meio { fill: none; stroke: var(--surface); stroke-width: 2.5; stroke-dasharray: 2 10; stroke-linecap: round; opacity: .9; }
.estrada-feita { fill: none; stroke: var(--ouro); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
.marco { position: absolute; z-index: 2; transform: translate(-50%, -50%); border: 0; background: none; padding: 0; display: grid; place-items: center; }
.m-dot { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); border: 2px solid var(--estrada-borda); color: var(--muted); }
.m-dot i { font: 700 14px/1 var(--f-body); font-style: normal; }
.marco.done .m-dot, .m-dot.aqui { background: var(--ouro); border-color: var(--ouro-dk); color: var(--noite); }
.marco.done .m-dot .ic { width: 16px; height: 16px; stroke-width: 3.5; }
.marco.cur { z-index: 3; }
.m-lbl { position: absolute; z-index: 1; display: flex; flex-direction: column; gap: 1px; max-width: 46%; padding: 5px 9px; border-radius: 10px; background: var(--surface); font-size: 13px; line-height: 1.3; pointer-events: none; }
.m-lbl.dir { transform: translate(28px, -50%); text-align: left; }
.m-lbl.esq { transform: translate(-28px, -50%); text-align: right; align-items: flex-end; }
.m-lbl.cur.dir { transform: translate(42px, -50%); } .m-lbl.cur.esq { transform: translate(-42px, -50%); }
.m-lbl b { font-weight: 700; font-size: 14px; }
.m-lbl small { color: var(--muted); font-size: 12px; }
.m-lbl em { font-style: normal; font-weight: 800; font-size: 12px; color: var(--ouro-ink); }
.m-lbl.lock { background: transparent; } .m-lbl.lock b { color: var(--muted); font-weight: 600; }
.camp { position: absolute; z-index: 2; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; max-width: 78%; padding: 6px 16px; border-radius: 14px; background: var(--noite); color: var(--pergaminho); text-align: center; }
.camp b { font-size: 13px; font-weight: 800; color: var(--ouro); }
.camp small { font-size: 12px; color: rgba(245,241,230,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.m-nota { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); transform: translateY(-50%); }
.m-vaso { width: 30px; height: 34px; display: block; }
.marco.vasoM { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); border: 2px solid var(--estrada-borda); }
.marco.vasoM.ready { border-color: var(--ouro-dk); background: var(--mine); }
.marco.vasoM.lock .m-vaso { opacity: .45; filter: grayscale(1); }
.marco.vasoM.opened { opacity: .6; }
.destino { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; margin: 16px 0 6px; padding: 16px; text-align: center; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.destino b { font-size: 17px; overflow-wrap: anywhere; } .destino small { color: var(--muted); }
.destino .btn { margin-top: 8px; }
.mani-mapa { position: absolute; z-index: 4; width: 48px; height: 48px; margin: 0; pointer-events: none; transform: translate(-50%, -100%); }
.mani-mapa img { display: block; width: 48px; height: 48px; min-height: 48px; object-fit: contain; transform: none; }
.mani-mapa.espera { visibility: hidden; }

/* Desafios de hoje */
.tarefas { display: flex; flex-direction: column; gap: 6px; }
.boost { font-size: 13px; font-weight: 700; color: var(--muted); }
.tarefas ul { list-style: none; padding: 0; border-top: 1px solid var(--line); }
.tarefas li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tk { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-dk); display: grid; place-items: center; }
.tarefas li.ok .tk { background: var(--noite); border-color: var(--noite); color: var(--ouro); }
.tt { flex: 1; min-width: 0; font-size: 15px; }
.tarefas li.ok .tt { color: var(--muted); }

/* Mani */
.mani { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none; }
.m-tile { display: block; background: transparent; padding: 0; line-height: 0; }
.m-tile img { display: block; width: auto; height: 72px; min-height: 48px; max-width: 100%; transform: none; }
.m-sm .m-tile img { height: 72px; }
.m-md .m-tile img { height: 112px; }
.m-lg .m-tile img { height: 160px; }
.m-hero .m-tile img { height: min(180px, 42vw); min-height: 96px; }
.m-fala { position: relative; margin: 0; padding: 8px 12px; border-radius: 16px; background: #fff; color: #0F1B3D; border: 1px solid #E2DAC6; font-size: 15px; font-weight: 600; line-height: 1.35; text-align: center; max-width: 34ch; }
.mani.row .m-fala { text-align: left; }
.mani-slot { display: flex; justify-content: flex-start; }

/* Ofensiva */
function study(caps) {
  const t = todayK(), st = S.streak; let up = false;
  ui.novoRecorde = false;
  if (st.last !== t) {
    const next = st.last && diff(st.last, t) === 1 ? st.count + 1 : 1;
    ui.novoRecorde = st.best > 0 && next > st.best;
    st.count = next;
    st.last = t; st.best = Math.max(st.best, st.count); up = true;
  }
  if (!S.days.includes(t)) S.days.push(t);
  if (caps) { S.chapters += caps; S.chapLog.push({ d: t, c: caps }); bump('caps', caps); }
  checkAch(); save();
  return up;
}
function checkStreak() {
  const st = S.streak, t = todayK();
  if (!st.last || !st.count) return;
  const missed = diff(st.last, t) - 1;
  if (!(missed >= 1)) return;
  if (missed <= S.protetores) {
    S.protetores -= missed; st.last = addDays(t, -1);
    ui.notice = (missed === 1 ? 'Você não estudou ontem' : 'Você ficou ' + missed + ' dias sem estudar') + ', e ' + plural(missed, 'protetor salvou', 'protetores salvaram') + ' sua ofensiva de ' + plural(st.count, 'dia', 'dias') + '.';
  } else {
    S.lost = { count: st.count, d: t };
    ui.notice = 'Sua ofensiva de ' + plural(st.count, 'dia', 'dias') + ' acabou. Dá para recuperar na loja hoje, ou começar outra.';

function ensureQuests() {
  const t = todayK();
  if (S.quests && S.quests.d === t && S.quests.list.every(q => questDef(q.id))) return;
  const h = hash(t), pool = QUEST_POOL.slice(), list = [pool.splice(0, 1)[0]];

const RIVAIS = ['Débora', 'Pr. Samuel', 'Lucas', 'Raquel', 'Tiago', 'Ana Clara', 'Josué', 'Priscila', 'Mateus'];
function leagueTable(week, dayIdx) {
  const div = S.league.div;
  const rows = RIVAIS.map(n => {
    const h = hash(week + n);
    const base = 4 + (h % 28) + div * 5;
    const xp = Math.max(0, Math.floor(base * (dayIdx + 1) * (0.7 + ((h >> 8) % 60) / 100)));
    return { nome: n, xp };
  });
  rows.push({ nome: S.nome || 'Você', xp: weekXPFrom(week), me: true });
  return rows.sort((a, b) => b.xp - a.xp || (a.me ? -1 : b.me ? 1 : a.nome.localeCompare(b.nome, 'pt')));
}
function checkLeague() {
  const w = weekStart();
  if (!S.league.week) { S.league.week = w; return; }
  if (S.league.week === w) return;
  const rows = leagueTable(S.league.week, 6), pos = rows.findIndex(r => r.me) + 1;
  const antes = S.league.div;
  if (pos <= 3 && S.league.div < LIGAS.length - 1) S.league.div++;
  else if (pos >= 9 && S.league.div > 0) S.league.div--;
  S.league.week = w;
  const d = S.league.div;
  ui.notice = 'A liga da semana passada acabou: você ficou em ' + pos + 'º. ' + (d > antes ? 'Você subiu para a Liga ' + LIGAS[d].nome + '.' : d < antes ? 'Você voltou para a Liga ' + LIGAS[d].nome + '.' : 'Você continua na Liga ' + LIGAS[d].nome + '.');

const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function rain(n) {

  document.querySelectorAll('canvas.rain').forEach(x => x.remove());
  const c = document.createElement('canvas'); c.className = 'rain'; document.body.appendChild(c); setTimeout(() => c.remove(), 2800);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; const x = c.getContext('2d'); x.scale(dpr, dpr);

const TIPOS = ['Plano', 'Livro', 'Personagem', 'Época', 'Tema'];
const GEN_CACHE = {};
function trilhaGen(id) {
  if (GEN_CACHE[id]) return GEN_CACHE[id];
  let t = null;
  const pl = PLANOS.find(p => p.id === id);
  if (pl) t = { id, tipo: 'Plano', nome: pl.nome, desc: pl.desc, unit: pl.unit, licoes: pl.gen() };
  else if (id.startsWith('livro:')) {
    const b = Number(id.slice(6)), [n, k] = LIVROS[b] || [];
    if (n) t = { id, tipo: 'Livro', nome: n, desc: LIVRO_DESC[n] || plural(k, 'capítulo', 'capítulos') + ', um por lição.', licoes: Array.from({ length: k }, (_, i) => ({ ref: n + ' ' + (i + 1), titulo: n + ' ' + (i + 1), caps: 1 })) };
  } else {
    const x = PERSONAGENS.find(p => p.id === id) || EPOCAS.find(p => p.id === id);
    if (x) t = Object.assign({ tipo: id.startsWith('per:') ? 'Personagem' : 'Época' }, x);
  }
  if (t) GEN_CACHE[id] = t;
  return t;
}
function catalogo() {
  const livros = LIVROS.map(([n], b) => CURADOS[n] ? TRILHAS.find(t => t.id === CURADOS[n]) : trilhaGen('livro:' + b));
  return [].concat(PLANOS.map(p => trilhaGen(p.id)), livros, TRILHAS.filter(t => t.tipo === 'Personagem'), PERSONAGENS.map(p => trilhaGen(p.id)), EPOCAS.map(p => trilhaGen(p.id)), TRILHAS.filter(t => t.tipo === 'Tema'));
}

function sugerirLocal(texto, sel) {
  const t = norm(texto || ''), out = [];
  const add = id => { if (!out.includes(id) && trilha(id)) out.push(id); };
  (sel || []).forEach(x => { const o = OBJ_OPCOES.find(y => y.id === x); if (o && o.ids[0]) add(o.ids[0]); });

  if (/novo testamento/.test(t)) add('plano:nt90');
  if (/antigo testamento|velho testamento/.test(t)) add('plano:at1ano');
  if (/evangelho/.test(t)) { add('plano:evangelhos'); add('joao'); }
  LIVROS.forEach(([n], b) => { if (new RegExp('\\b' + norm(n) + '\\b').test(t) && n !== 'Jó') add(CURADOS[n] || 'livro:' + b); });
  [...TRILHAS.filter(x => x.tipo === 'Personagem'), ...PERSONAGENS].forEach(p => { if (t.includes(norm(p.nome.split(',')[0]).split(' ')[0])) add(p.id); });
  const ep = { 'ep:origens': /criacao|patriarca|genesis|diluvio/, 'ep:exodo': /exodo|deserto|egito|mana|sinai/, 'ep:juizes': /juizes|conquista|canaa/, 'ep:reino': /reis|reino|rei davi|salomao|monarquia/, 'ep:profetas': /profeta/, 'ep:exilio': /exilio|babilonia|retorno/, 'ep:jesus': /vida de jesus|jesus/, 'ep:igreja': /igreja primitiva|apostolo|atos|pentecostes/ };
  Object.entries(ep).forEach(([id, re]) => { if (re.test(t)) add(id); });
  const tm = { oracao: /orac|orar/, familia: /famil|casamento|filhos|marido|esposa/, financas: /financ|dinheiro|divida|dizimo/, ansiedade: /ansied|medo|paz|depress|preocup/ };
  Object.entries(tm).forEach(([id, re]) => { if (re.test(t)) add(id); });
  if (/personage/.test(t)) ['davi', 'per:moises', 'per:daniel', 'paulo'].forEach(add);
  if (/livro/.test(t)) ['romanos', 'joao', 'livro:0', 'salmos'].forEach(add);
  if (/epoca|historia|periodo|cronolog/.test(t)) ['ep:origens', 'ep:exodo', 'ep:reino', 'ep:jesus'].forEach(add);
  if (/tema|vida crista|assunto/.test(t)) ['oracao', 'familia', 'ansiedade', 'financas'].forEach(add);
  if (/todo dia|habito|voltar|parei|constancia/.test(t)) ['salmos', 'proverbios', 'plano:evangelhos'].forEach(add);
  if (/ebd|escola sabatina|escola dominical|aula|professor/.test(t)) ['romanos', 'ep:jesus'].forEach(add);
  (sel || []).forEach(k => { const o = OBJ_OPCOES.find(x => x.id === k); if (o) o.ids.slice(0, 2).forEach(add); });
  (sel || []).forEach(k => { const o = OBJ_OPCOES.find(x => x.id === k); if (o) o.ids.slice(2).forEach(add); });
  if (out.length < 3) ['plano:biblia1ano', 'joao', 'oracao', 'per:moises'].forEach(add);
  return out.slice(0, 10);
}

/* ---------- Mapa da caminhada ---------- */
function catmull(pts) {

function mapWidth() {

function pontoCurva(p0, c1, c2, p3, t) {
  const u = 1 - t, uu = u * u, tt = t * t;

    uu * u * p0[0] + 3 * uu * t * c1[0] + 3 * u * tt * c2[0] + tt * t * p3[0],

  if (!topo) { mapa.classList.remove('espera'); return; }
  const r = topo.getBoundingClientRect();
  mapa.classList.toggle('espera', r.bottom > 0 && r.top < window.innerHeight);
}
function andarMani() {
  const el = document.getElementById('mani-mapa');
  const pts = ui.andarPts;
  if (!el) { ui.andar = null; ui.andarPts = null; return; }
  const topo = document.querySelector('.topo-j .mani');
  const box = el.getBoundingClientRect();
  let top = box.top + window.scrollY - window.innerHeight * 0.38;
  if (topo) top = Math.max(top, topo.getBoundingClientRect().bottom + window.scrollY + 8);
  window.scrollTo(0, Math.max(0, top));
  if (reduceMotion() || !pts || pts.length < 2) {
    if (pts && pts.length) porManiMapa(el, pts[pts.length - 1]);
    ui.andar = null; ui.andarPts = null; ui.andando = false; syncManiMapa();
    return;
  }
  ui.andando = true;
  el.classList.remove('espera');
  const dur = 1100, t0 = performance.now();
  cancelAnimationFrame(ui.andarFrame || 0);
  const frame = (now) => {
    if (!el.isConnected) { ui.andando = false; return; }
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    const x = e * (pts.length - 1), i = Math.max(0, Math.min(pts.length - 2, Math.floor(x))), f = x - i;
    const a = pts[i], b = pts[Math.min(pts.length - 1, i + 1)] || a;
    if (!a || !b) { porManiMapa(el, pts[pts.length - 1]); ui.andar = null; ui.andarPts = null; ui.andando = false; syncManiMapa(); return; }
    porManiMapa(el, [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
    if (p < 1) ui.andarFrame = requestAnimationFrame(frame);
    else { porManiMapa(el, pts[pts.length - 1]); ui.andar = null; ui.andarPts = null; ui.andando = false; syncManiMapa(); }
  };
  if (ui.andar) SND.passos((ui.andar.para - ui.andar.de) * 3 + 2);
  ui.andarFrame = requestAnimationFrame(frame);
}

/* ---------- Devocional da porção: citação, passagem, devocional e oração ---------- */
const DEV_STEPS = [

const words = s => s.replace(/[.,;:"()?!]/g, '').split(/\s+/).filter(Boolean);
const vref = x => LIVROS[x.b][0] + ' ' + x.c + ':' + x.v;
const PERGUNTAS_BASE = [

  'Se você levasse esta palavra a sério hoje, o que faria diferente?',
];
function versoChave(vs) {
  if (!vs.length) return null;
  const cand = vs.filter(x => { const n = words(x.t).length; return n >= 8 && n <= 34; });
  const v = cand.find(x => /\b(Deus|Senhor|SENHOR|Jesus|Cristo|amor|fé|graça|paz|esperança)\b/.test(x.t)) || cand[0] || vs[0];
  return { ref: vref(v), t: v.t };
}
/* Devocional sem IA: usa o contexto da lição e um versículo-chave do próprio texto */
function devLocal(t, i, vs) {

async function devIA(L) {

    const med = (Array.isArray(r.meditacao) ? r.meditacao : []).map(String).filter(Boolean).slice(0, 5);

/* ---------- Trilhas criadas por IA ou a partir de uma pregação ---------- */
async function genTrail(tema, fonte) {
  const prompt = REGRAS + '\n\nMonte uma trilha de estudo bíblico ' + (fonte ? 'a partir desta pregação ou anotação:\n"""\n' + fonte.slice(0, 12000) + '\n"""\n' : '') + 'Tema: ' + tema + '.\nCrie de 5 a 8 lições curtas em sequência lógica. Cada lição tem um texto bíblico principal com referência exata no formato "Livro capítulo" ou "Livro capítulo:versículo-versículo", com nomes dos livros em português (ex.: "1 Coríntios 13", "Salmos 23", "Mateus 6:25-34"), um título curto, 1 ou 2 frases de contexto e uma pergunta de reflexão.\nResponda só com JSON: {"nome": "nome curto da trilha", "desc": "1 frase", "licoes": [{"titulo": "...", "ref": "...", "contexto": "...", "pergunta": "..."}]}';
  aiCtl = new AbortController();
  const r = await SAMPLE.json(prompt, { signal: aiCtl.signal });
  if (!r || typeof r !== 'object') throw { code: 'vazio' };
  const licoes = (r.licoes || []).filter(x => x && x.ref && parseRef(String(x.ref)).length).slice(0, 10)
    .map(x => ({ ref: String(x.ref), titulo: String(x.titulo || x.ref), ctx: String(x.contexto || ''), q: String(x.pergunta || ''), caps: new Set(parseRef(String(x.ref)).map(s => s.b + ':' + s.c)).size }));
  if (!licoes.length) throw { code: 'vazio' };
  return { id: 'custom:' + uid(), tipo: 'Tema', origem: fonte ? 'pregacao' : 'ia', nome: String(r.nome || tema).slice(0, 60), desc: String(r.desc || ''), licoes };
}
function localTrail(tema, texto) {
  const refs = findRefs(texto).slice(0, 10);
  if (!refs.length) return null;
  return { id: 'custom:' + uid(), tipo: 'Tema', origem: 'pregacao', nome: tema.slice(0, 60), desc: 'Os textos citados na pregação, um por lição.', licoes: refs.map(r => ({ ref: r, titulo: r, caps: new Set(parseRef(r).map(s => s.b + ':' + s.c)).size })) };
}
function saveTrail(t, add) {
  S.custom[t.id] = t;
  if (add && !S.quiz.trilhas.includes(t.id) && S.quiz.trilhas.length < MAX_METAS) S.quiz.trilhas.push(t.id);
  save();
}

/* Reduz a foto para caber no aparelho (máx. 720 px, JPEG) */
function reduzFoto(file) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 720 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('imagem')); };
    img.src = url;
  });
}

}
function digitarHebraico() {

const TABS = () => [['jornada', 'Hoje', 'jornada'], ['biblia', 'Bíblia', 'livro'], ['explorar', 'Explorar', 'explorar'], ['domingo', nomeCulto(), 'domingo'], ['grupo', 'Grupo', 'grupo'], ['perfil', 'Perfil', 'perfil']];
function renderLesson() { const app = $('app'); if (app && ui.L) app.innerHTML = vLessonScreen() + (ui.sheet ? vSheet() : ''); }
function extras() { return (ui.sheet ? vSheet() : '') + (ui.modal ? vModal() : ''); }
function render() {
  const app = $('app'); if (!app) return;
  const y = window.scrollY;
  document.body.classList.toggle('in-lesson', !!(ui.L || ui.foco));
  document.body.classList.toggle('ov-open', !!(ui.sheet || ui.modal));
  document.body.classList.toggle('tela-noite', !ui.introOk || !S.conta);
  if (!ui.introOk) { app.innerHTML = vAbertura(); agendarIntro(); }
  else if (!S.conta) { app.innerHTML = vLogin() + extras(); digitarHebraico(); }
  else if (!S.onboarded) { app.innerHTML = vOnboarding() + extras(); }
  else if (ui.L) { app.innerHTML = vLessonScreen() + extras(); }
  else if (ui.foco) { app.innerHTML = vFocoTela(); }
  else {
    let h;
    if (ui.ov) h = '<div class="ov">' + ({ culto: vCulto, ebd: vEbd, duvida: vDuvida, loja: vLoja, plano: vPlano, explorar: vExplorar, igreja: vIgreja, diario: vDiario }[ui.ov.type])(ui.ov.id) + '</div>';
    else h = ({ jornada: vJornada, biblia: vBiblia, explorar: vExplorar, domingo: vDomingo, duvidas: vDuvidas, grupo: vGrupoTab, perfil: vPerfil }[ui.tab])() +
      '<nav class="tabs" aria-label="Seções">' + TABS().map(([k, n, ic]) => '<button data-a="tab" data-tab="' + k + '"' + (ui.tab === k ? ' aria-current="page"' : '') + '>' + icon(ic) + '<span>' + n + '</span></button>').join('') + '</nav>';
    if (ui.sheet) h += vSheet();
    if (ui.modal) h += vModal();
    app.innerHTML = h;
  }
  if (render.keep) window.scrollTo(0, y);
  render.keep = false;
  const dlg = document.querySelector('[role="dialog"]');
  if (dlg && !dlg.contains(document.activeElement)) {
    const b = dlg.querySelector('button, [href], input, textarea, select');
    if (b) b.focus();
  }
  if (ui.andar && !ui.andando && document.getElementById('mani-mapa')) andarMani();
  else if (typeof syncManiMapa === 'function') syncManiMapa();
}
function renderToast() {

  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = ui.toast; t.hidden = !ui.toast;
}
function go(fn) { fn(); save(); render(); }
function keep() { render.keep = true; render(); }
function openOv(type, id) { ui.ov = { type, id }; ui.aiErr = ''; ui.busy = false; window.scrollTo(0, 0); render(); }

/* ---------- Ações ---------- */
const A = {
  next() {
    if (ui.L) return lessonNext();
    go(() => { S.step++; }); window.scrollTo(0, 0);
  },
  pularIntro() { clearTimeout(ui.introTimer); ui.introOk = true; render(); },
  abrirLogin() { ui.sheet = 'login'; ui.emailAberto = false; keep(); },
  entrar(el) {
    const p = el.dataset.p;
    if (p === 'email') { ui.emailAberto = true; ui.sheet = 'login'; keep(); return; }
    if (!['google', 'apple', 'aparelho'].includes(p)) return;
    S.conta = p; ui.sheet = null; save(); window.scrollTo(0, 0); render();
  },
  pedirAviso() {
    S.hora = S.quiz.horario || S.hora || '7h';
    S.quiz.horario = S.hora;
    const seguir = estado => { S.aviso = estado; S.step++; save(); window.scrollTo(0, 0); render(); };
    if (typeof Notification === 'function' && Notification.requestPermission) Notification.requestPermission().then(seguir, () => seguir('negado'));
    else seguir('simulado');
  },
  pularAviso() { S.aviso = 'nao'; S.hora = S.quiz.horario || '7h'; go(() => { S.step++; }); window.scrollTo(0, 0); },
  querWidget() { S.widget = true; go(() => { S.step++; }); window.scrollTo(0, 0); },
  pularWidget() { S.widget = false; go(() => { S.step++; }); window.scrollTo(0, 0); },
  back() { go(() => { S.step = Math.max(0, S.step - 1); }); },
  answer(el) {
    const k = el.dataset.k; let v = el.dataset.v;
    if (k === 'minutos') { v = Number(v); S.goal = goalFor(v); }
    S.quiz[k] = v;
    if (k === 'denom') { const d = DENOMINACOES.find(x => x[0] === v); S.quiz.tradicao = d ? d[1] : null; }
    save(); render(); setTimeout(() => A.next(), 220);
  },
  pickTrail(el) {
    const id = el.dataset.id, a = S.quiz.trilhas, i = a.indexOf(id);
    if (i === -1 && barraPlano(id)) return;
    if (i > -1) a.splice(i, 1); else if (a.length < MAX_METAS) a.push(id); else toast('Você já tem ' + MAX_METAS + ' metas.');
    save(); keep();
  },
  plan(el) { ui.plusPlano = el.dataset.id; S.plusPlano = el.dataset.id; save(); keep(); },
  trial() { iniciarTeste(ui.plusPlano || S.plusPlano || 'anual'); ui.sheet = null; toast('Teste de 7 dias ligado. Nada é cobrado nesta versão.'); render(); },
  finish() { go(() => { S.onboarded = true; ui.tab = 'jornada'; }); window.scrollTo(0, 0); },
  tab(el) { ui.tab = el.dataset.tab; ui.aiErr = ''; ui.confirmReset = false; window.scrollTo(0, 0); render(); },
  open(el) { openOv(el.dataset.ov, el.dataset.id); },
  close() { ui.ov = null; ui.geo = null; if (ui.draft) delete ui.draft['ig-lugar']; if (aiCtl) aiCtl.abort(); ui.busy = false; window.scrollTo(0, 0); render(); },
  dismiss() { ui.notice = ''; keep(); },
  sheet(el) { ui.sheet = el.dataset.s; keep(); },
  sheetStart(el) { ui.sheet = null; startLesson(curTrail(), Number(el.dataset.i), el.dataset.r === '1'); window.scrollTo(0, 0); },
  closeSheet() { ui.ckFoto = null; ui.sheet = null; keep(); },
  closeModal() { ui.modal = null; keep(); },
  goTrail(el) { if (!S.quiz.trilhas.includes(el.dataset.id) && barraPlano(el.dataset.id)) return; if (!S.quiz.trilhas.includes(el.dataset.id)) S.quiz.trilhas.push(el.dataset.id); S.cur = el.dataset.id; ui.sheet = null; ui.ov = null; ui.tab = 'jornada'; save(); window.scrollTo(0, 0); render(); },
  addMeta(el) {
    if (S.quiz.trilhas.length >= MAX_METAS) { toast('Você já tem ' + MAX_METAS + ' metas.'); return; }
    if (!S.quiz.trilhas.includes(el.dataset.id) && barraPlano(el.dataset.id)) return;
    if (!S.quiz.trilhas.includes(el.dataset.id)) S.quiz.trilhas.push(el.dataset.id);
    toast('Meta adicionada: ' + trilha(el.dataset.id).nome); save(); keep();
  },
  marco(el) {
    const i = Number(el.dataset.i), st = el.dataset.st;
    if (st === 'lock') { toast('Esse trecho abre depois da lição anterior.'); return; }
    ui.sheet = 'licao'; ui.sheetI = i; keep();
  },
  startLesson(el) { startLesson(curTrail(), Number(el.dataset.i), el.dataset.r === '1'); window.scrollTo(0, 0); },
  chest(el) {
    const id = curTrail(), u = Number(el.dataset.u), ck = id + ':' + u;
    if (S.chests[ck]) { toast('Você já abriu este vaso.'); return; }
    if (doneCount(id) < Math.min(trilha(id).licoes.length, (u + 1) * (trilha(id).unit || UNIT))) { toast('Complete as lições da unidade para abrir o vaso.'); return; }
    const g = 15 + hash(ck) % 16; S.chests[ck] = true; S.grains += g; save();
    ui.modal = { art: ART.mani('mani m-md', 'surpreso', 'Olha o que você ganhou!'), t: 'Vaso de maná aberto', p: 'Você ganhou ' + g + ' grãos de maná. Use na loja para proteger sua ofensiva.' };
    SND.vaso(); keep(); rain(40);
  },
  claim(el) {
    const q = S.quests.list[Number(el.dataset.i)]; if (!q || q.claimed || q.p < q.n) return;
    q.claimed = true; S.grains += 10; SND.vaso(); toast('+10 grãos de maná'); save(); keep();
  },
  buy(el) {
    const id = el.dataset.id, preco = { protetor: 50, dobro: 60, recuperar: 150 }[id];
    if (S.grains < preco) return;
    S.grains -= preco;
    if (id === 'protetor') { S.protetores = Math.min(2, S.protetores + 1); toast('Protetor guardado.'); }
    if (id === 'dobro') { S.boostUntil = Date.now() + 15 * 60000; toast('XP em dobro por 15 minutos.'); }
    if (id === 'recuperar' && S.lost) { const c = S.lost.count + (S.streak.count ? 1 : 0); S.streak.count = c; S.streak.last = S.streak.count > S.lost.count ? todayK() : addDays(todayK(), -1); S.streak.best = Math.max(S.streak.best, c); S.lost = null; ui.notice = ''; toast('Ofensiva de ' + plural(c, 'dia', 'dias') + ' recuperada.'); }
    SND.vaso(); save(); keep();
  },
  toggleMeta(el) {
    const id = el.dataset.id, a = S.quiz.trilhas, i = a.indexOf(id);

function lessonNext(semSom) {

function ouvirAlvo(qual) {
  let texto = '';
  if (qual === 'oracao' && ui.L && ui.L.dev) texto = ui.L.dev.oracao;
  else if (ui.foco && ui.bib && ui.bib.c) {
    const vs = versesOf(LIVROS[ui.bib.b][0] + ' ' + ui.bib.c);
    const x = vs[ui.foco.i || 0];
    texto = x ? x.t : '';
  } else if (ui.bib && ui.bib.c) {
    texto = versesOf(LIVROS[ui.bib.b][0] + ' ' + ui.bib.c).map(x => x.t).join(' ');
  }
  const syn = window.speechSynthesis;
  if (!syn || typeof SpeechSynthesisUtterance !== 'function') { toast('Este navegador não lê em voz alta.'); return; }
  texto = String(texto || '').replace(/\s+/g, ' ').trim().slice(0, 3500);
  if (!texto) { toast('Não há texto para ler.'); return; }
  syn.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'pt-BR'; u.rate = 0.95; syn.speak(u);
}

    S.onboarded = true; ui.tab = 'grupo'; ui.gTab = 'grupo'; ui.groupMode = null; save(); window.scrollTo(0, 0); render(); toast('Você entrou num grupo de exemplo.');
  },
  checkin() {
    const caps = Math.max(0, Math.min(50, parseInt(val('ck-caps'), 10) || 0)), ref = val('ck-ref'), txt = val('ck-txt');
    if (!caps && !txt && !ui.ckFoto) { toast('Informe os capítulos, escreva algo ou envie uma foto.'); return; }
    if (caps) { study(caps); addXP(10 * caps); }
    postFeed(txt || (caps ? 'Li ' + plural(caps, 'capítulo', 'capítulos') + ' hoje.' : ''), ref, { caps, foto: ui.ckFoto || '' });
    ui.ckFoto = null; ui.sheet = null; ui.gSub = 'feed'; if (ui.draft) ['ck-txt', 'ck-caps', 'ck-ref'].forEach(k => delete ui.draft[k]);
    SND.check();
    toast(caps ? 'Check-in postado. Ofensiva: ' + plural(S.streak.count, 'dia', 'dias') + '.' : 'Check-in postado.'); save(); keep();
  },
  cmt(form) {
    const t = val('cmt-txt'); if (!t) return;
    S.group.feed.find(x => x.id === form.dataset.id).comments.push({ who: S.nome || 'Você', text: t }); ui.cmt = null; save(); keep();
  },
  ajustes() {
    S.nome = val('p-nome'); S.goal = Number(val('p-goal')) || 30; S.quiz.horario = val('p-hor'); S.sound = !!($('p-som') && $('p-som').checked);
    save(); toast('Ajustes salvos.'); keep();
  },
};

const SONS_TOQUE = new Set(['tab', 'gTab', 'gSub', 'dom', 'ebdModo', 'bibMode', 'expl', 'objToggle', 'pickTrail', 'answer', 'plan', 'toggleMeta', 'marco', 'sheet', 'open', 'close', 'closeSheet', 'gmode', 'bibBook', 'bibGo', 'bibChap', 'verse', 'next', 'back', 'goTrail', 'hinoFav', 'cmt']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn || el.tagName === 'A') return;
  if (SONS_TOQUE.has(el.dataset.a)) SND.toque();
  e.preventDefault(); fn(el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (ui.modal) { e.preventDefault(); A.closeModal(); return; }
    if (ui.sheet) { e.preventDefault(); A.closeSheet(); return; }
    if (e.target.matches('textarea, input, select')) return;
    if (ui.L && ui.L.phase === 'sair') { A.lessonStay(); return; }
    if (ui.L) { A.lessonExit(); return; }
    if (ui.ov) { A.close(); return; }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-a]') && !e.target.matches('button, a, input, textarea, select')) {
    e.preventDefault(); e.target.click(); return;
  }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.getAttribute('role') === 'tab' && e.target.closest('[role="tablist"]')) {
    const tabs = [...e.target.parentElement.querySelectorAll('[role="tab"]')];
    const i = tabs.indexOf(e.target);
    if (i < 0) return;
    const n = e.key === 'ArrowRight' ? (i + 1) % tabs.length : (i - 1 + tabs.length) % tabs.length;
    e.preventDefault();
    tabs[n].click();
    const sel = document.querySelector('[role="tab"][aria-selected="true"], [role="tab"][aria-checked="true"]');
    if (sel) sel.focus();
    return;
  }
  if (ui.L && e.key === 'Enter' && !e.target.matches('textarea,input')) {
    const b = document.querySelector('.lfoot .btn:not([disabled])'); if (b) { e.preventDefault(); b.click(); }
  }
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target.dataset.f; if (F[f]) F[f](e.target); });
document.addEventListener('input', e => {
  if (e.target.id === 'd-filtro') {
    ui.filtro = e.target.value; const pos = e.target.selectionStart; keep();
    const n = $('d-filtro'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} }
  }
  if (/^rf-\d$/.test(e.target.id) && ui.L) { respostas(ui.L)[Number(e.target.id.slice(3))] = e.target.value; save(); }
  if (/^ck-(txt|caps|ref)$/.test(e.target.id) || e.target.id === 'ig-lugar') { ui.draft = ui.draft || {}; ui.draft[e.target.id] = e.target.value; }
  if (/^(c|e)-/.test(e.target.id) && e.target.type !== 'file') { ui.draft = ui.draft || {}; ui.draft[e.target.id] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; }
  if (e.target.id === 'obj' && !S.onboarded) { S.objetivo = e.target.value; save(); const b = document.querySelector('[data-a="objNext"]'); if (b) b.disabled = !objPronto(); }
  if (e.target.id === 'expl-f' || e.target.id === 'bib-f') {
    ui[e.target.id === 'expl-f' ? 'explF' : 'bibF'] = e.target.value; const id = e.target.id, pos = e.target.selectionStart; keep();
    const n = $(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'p-som') { S.sound = e.target.checked; save(); if (S.sound) SND.check(); }
  if (e.target.id === 'ck-foto' && e.target.files && e.target.files[0]) {
    reduzFoto(e.target.files[0]).then(u => { ui.ckFoto = u; keep(); }).catch(() => toast('Não deu para abrir essa foto. Tente outra.'));
  }
  if (e.target.id === 'h-sel') { S.hinario = e.target.value; save(); keep(); }
  if (e.target.id === 'c-trilha') { ui.draft = ui.draft || {}; ui.draft['c-trilha'] = e.target.checked; }
  if (e.target.id === 'c-file' && e.target.files && e.target.files[0]) {
    const f = e.target.files[0];
    if (f.size > 2000000) { toast('Arquivo grande demais. Envie até 2 MB de texto.'); return; }
    ui.fileName = f.name;
    const r = new FileReader();
    r.onload = () => {
      const txt = String(r.result || '').replace(/^WEBVTT.*$/m, '').replace(/^\d+\s*$/gm, '').replace(/^[\d:.,]+\s*-->\s*[\d:.,]+.*$/gm, '').replace(/<[^>]+>/g, '').replace(/\n{2,}/g, '\n').trim();
      ui.draft = ui.draft || {}; ui.draft['c-trans'] = txt; toast('Transcrição carregada: ' + txt.split(/\s+/).length + ' palavras.'); keep();
    };
    r.readAsText(f);
  }
  if (e.target.id === 'l-lido' && ui.L) { if (e.target.checked) SND.lido(); ui.L.lido = e.target.checked; const b = document.querySelector('.lfoot .btn'); if (b) b.disabled = !ui.L.lido; }
  if (e.target.dataset && e.target.dataset.passo && ui.L) {
    ui.L.checks = ui.L.checks || {};
    ui.L.checks[e.target.dataset.passo] = e.target.checked;
    const b = document.querySelector('.lfoot .btn[data-a="next"]');
    if (b) b.disabled = !e.target.checked;
  }
});

/* Abrir uma dúvida conta como estudada */
const _openOv = openOv;
openOv = function (type, id) {
  if (type === 'duvida' && DUVIDAS.some(d => d.id === id) && !S.duvidasLidas.includes(id)) { S.duvidasLidas.push(id); addXP(5); bump('duvida', 1); checkAch(); save(); }
  _openOv(type, id);
};

ensureQuests(); checkStreak(); checkLeague(); save();
render(); renderToast();

/* O mapa é desenhado em pixels: redesenha quando a largura muda */
let lastW = 0;
window.addEventListener('scroll', () => { if (typeof syncManiMapa === 'function') syncManiMapa(); }, { passive: true });
window.addEventListener('resize', () => {
  clearTimeout(window.__rz); window.__rz = setTimeout(() => {
    const w = mapWidth(); if (Math.abs(w - lastW) > 8 && S.onboarded && !ui.L && !ui.ov && ui.tab === 'jornada') { lastW = w; keep(); }
  }, 150);
});
