<title>Manna</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Sora:wght@600;700;800&display=swap">
<style>
/* Jornada pelo deserto: coluna de app, cores chapadas da marca, profundidade com bordas inferiores (sem sombras nem degradês). */
:root {
  --noite: #0F1B3D; --noite-dk: #070F28; --ouro: #F2C14E; --ouro-dk: #C9952B; --ceu: #A9C6E8; --pergaminho: #F5F1E6;
  --bg: #F5F1E6; --surface: #FFFCF4; --fg: #0F1B3D; --muted: #5A6278; --line: #E0D8C4; --line-dk: #CDC2A6; --soft: #ECE4CF;
  --link: #0F1B3D; --accent: #F2C14E; --on-accent: #0F1B3D;
  --ok: #2F7044; --ok-bg: #DDEFD9; --ok-btn: #3E8E57; --ok-btn-dk: #2C6B40;
  --bad: #A23A23; --bad-bg: #F9E1D8; --bad-btn: #C7553B; --bad-btn-dk: #97391F;
  --bloq: #E2DBC9; --bloq-dk: #BFB497; --mine: #FFF1C7; --chao: rgba(15,27,61,.10);
  --areia: #E7DCBF; --tenda: #C98F55; --tenda-dk: #9C6634; --tronco: #8A6A44; --folha: #6E9A5A; --folha-dk: #557E45;
  --nuvem: #D5E3F3; --pedra: #E9E2D2; --pedra-dk: #A99E86; --fogo: #E0703F;
  --vaso: #F2C14E; --vaso-tampa: #C9952B; --vaso-tr: #0F1B3D;
  --f-brand: 'Sora', 'Inter', system-ui, sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-book: 'Literata', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1B3D; --surface: #16244B; --fg: #F5F1E6; --muted: #A8B2CA; --line: #283A66; --line-dk: #1B2A52; --soft: #1D2D58;
    --link: #A9C6E8; --ok: #8FD3A1; --ok-bg: #173A2C; --bad: #F5A28C; --bad-bg: #44211C;
    --bloq: #22335F; --bloq-dk: #34487A; --mine: #273A6E; --chao: rgba(0,0,0,.25);
    --areia: #1D2D58; --tenda: #A9744A; --tenda-dk: #7E5232; --tronco: #8A6A44; --folha: #4F7A47; --folha-dk: #3D6337;
    --nuvem: #3A5383; --pedra: #2B3D6C; --pedra-dk: #5A6E9E; --vaso-tr: #070F28; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1B3D; --surface: #16244B; --fg: #F5F1E6; --muted: #A8B2CA; --line: #283A66; --line-dk: #1B2A52; --soft: #1D2D58;
  --link: #A9C6E8; --ok: #8FD3A1; --ok-bg: #173A2C; --bad: #F5A28C; --bad-bg: #44211C;
  --bloq: #22335F; --bloq-dk: #34487A; --mine: #273A6E; --chao: rgba(0,0,0,.25);
  --areia: #1D2D58; --tenda: #A9744A; --tenda-dk: #7E5232; --tronco: #8A6A44; --folha: #4F7A47; --folha-dk: #3D6337;
  --nuvem: #3A5383; --pedra: #2B3D6C; --pedra-dk: #5A6E9E; --vaso-tr: #070F28; color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
#app { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
body.in-lesson #app { padding-bottom: 0; }
h1, h2, h3, p, ol, ul { margin: 0; }
h1, h2, h3 { text-wrap: balance; line-height: 1.22; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--ceu); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: 13px; line-height: 1.45; }
.center-t { text-align: center; }
.err { color: var(--bad); font-size: 14px; }
.screen { display: flex; flex-direction: column; gap: 18px; padding-block: 16px 28px; }
.h1 { font: 800 27px/1.15 var(--f-brand); letter-spacing: -0.02em; }
.qt { font: 800 26px/1.2 var(--f-brand); letter-spacing: -0.02em; }
.body-l { font-size: 17px; }
.brand { font: 800 52px/1 var(--f-brand); letter-spacing: -0.04em; }
.brand.sm { font-size: 20px; }
.lead { font: 600 19px/1.3 var(--f-book); font-style: italic; color: var(--muted); }
.grp { font-size: 14px; color: var(--muted); font-weight: 700; margin-top: 4px; letter-spacing: .02em; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; } .ic.xs { width: 14px; height: 14px; stroke-width: 3; } .ic.lg { width: 34px; height: 34px; }
.grao { width: 16px; height: 21px; fill: var(--ouro); flex: none; }
.grao.huge { width: 52px; height: 68px; } .grao.lg { width: 30px; height: 40px; }
.vaso { width: 22px; height: 25px; flex: none; } .vaso.sm { width: 20px; height: 23px; } .vaso.xs { width: 14px; height: 16px; }
.logo { width: 30px; height: 30px; display: block; flex: none; } .logo.sm { width: 26px; height: 26px; }

/* Mascote */
.mani { width: 72px; height: 90px; flex: none; display: block; }
.mani.xs { width: 40px; height: 50px; } .mani.sm { width: 64px; height: 80px; } .mani.md { width: 96px; height: 120px; } .mani.lg { width: 140px; height: 174px; } .mani.hero { width: 150px; height: 186px; margin-top: -60px; position: relative; }
.speak { display: flex; align-items: flex-end; gap: 10px; }
.bubble { position: relative; flex: 1; min-width: 0; padding: 12px 16px; border: 2px solid var(--line); border-radius: 18px; background: var(--surface); font-size: 16px; font-weight: 500; }
.bubble::before { content: ""; position: absolute; left: -9px; bottom: 18px; width: 14px; height: 14px; background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.speak.small .bubble { font-size: 14px; padding: 8px 12px; }
@media (prefers-reduced-motion: no-preference) {
  .speak .mani, .path-end .mani { animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  .fim .mani { animation: hop .7s ease-out 2; transform-origin: 50% 100%; }
}
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-2deg); } }
@keyframes hop { 0% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(-18px) scale(.96,1.04); } 60% { transform: translateY(0) scale(1.05,.95); } 100% { transform: none; } }

/* Botões com volume: borda inferior mais escura */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 12px 18px; border: 0; border-radius: 16px; background: var(--accent); color: var(--on-accent); font: 800 16px/1.2 var(--f-body); letter-spacing: .02em; text-decoration: none; text-align: center; border-bottom: 5px solid var(--ouro-dk); transition: transform .06s, border-bottom-width .06s; }
.btn:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; }
.btn:disabled { background: var(--bloq); color: var(--muted); border-bottom-color: var(--bloq-dk); cursor: default; }
.btn.sec { background: var(--surface); color: var(--fg); border: 2px solid var(--line); border-bottom-width: 5px; }
.btn.ghost { background: transparent; color: var(--fg); border: 0; min-height: 44px; }
.btn.mini { width: auto; min-height: 36px; padding: 6px 12px; border-radius: 12px; font-size: 14px; border-bottom-width: 4px; }
.btn.mini.off { background: var(--bloq); color: var(--muted); border-bottom-color: var(--bloq-dk); }
.btn.okbtn { background: var(--ok-btn); color: #fff; border-bottom-color: var(--ok-btn-dk); }
.btn.badbtn { background: var(--bad-btn); color: #fff; border-bottom-color: var(--bad-btn-dk); }
.btn.wbtn { background: var(--surface); color: var(--noite); border-bottom-color: var(--line-dk); }
.danger-t { color: var(--bad); }
.link { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.link.danger { color: var(--bad); align-self: center; padding: 8px; }
.iconbtn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; border-radius: 12px; background: transparent; margin-left: -10px; color: var(--muted); flex: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 130px; width: auto; }
.busy { display: flex; flex-direction: column; gap: 8px; }
.sticky-cta { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); display: flex; flex-direction: column; gap: 8px; z-index: 3; }

/* Barras */
.bar { display: block; height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; flex: 1; min-width: 40px; }
.bar.thick { height: 16px; }
.bar i { display: block; height: 100%; min-width: 0; background: var(--accent); border-radius: 99px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .5s cubic-bezier(.2,.8,.2,1); } }

/* Onboarding */
.onb-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0; padding-bottom: 24px; }
.sky { width: calc(100% + 32px); margin-inline: -16px; background: var(--noite); padding: 40px 0 0; border-radius: 0 0 28px 28px; overflow: hidden; }
.sky .banner-art { width: 100%; height: auto; display: block; max-width: none; }
.onb-c { display: flex; flex-direction: column; gap: 14px; align-items: center; padding-top: 8px; }
.qhead { display: flex; align-items: center; gap: 8px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 12px 16px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px; font-weight: 600; font-size: 16px; }
.choice:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
.choice.sel { border-color: var(--ceu); background: color-mix(in srgb, var(--ceu) 22%, var(--surface)); }
.choice.right { border-color: var(--ok-btn); background: var(--ok-bg); color: var(--ok); }
.choice.wrong { border-color: var(--bad-btn); background: var(--bad-bg); color: var(--bad); }
.choice.dim { opacity: .55; }
.choice .key { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 9px; font-size: 14px; color: var(--muted); }
.choice.sel .key { border-color: var(--ceu); color: var(--fg); }
.choice.plan { justify-content: space-between; padding-block: 16px; }
.pl-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pl-l small, .pl-p small { color: var(--muted); font-weight: 400; font-size: 14px; }
.pl-p { display: flex; flex-direction: column; align-items: flex-end; }
.pl-p b { font: 800 19px/1.1 var(--f-brand); }
.ribbon { position: absolute; top: -12px; left: 14px; background: var(--noite); color: var(--ouro); font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; letter-spacing: .03em; }
.cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 14px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px; min-width: 0; }
.pick b { font: 700 16px/1.2 var(--f-brand); }
.pick small { font-size: 13px; color: var(--muted); line-height: 1.35; }
.pick > span { font-size: 12px; margin-top: auto; padding-top: 4px; }
.pick.on { border-color: var(--ouro-dk); background: var(--mine); }
.ord { position: absolute; top: -10px; right: -6px; font-style: normal; font-weight: 800; width: 28px; height: 28px; border-radius: 50%; background: var(--noite); color: var(--ouro); display: grid; place-items: center; font-size: 14px; }
.plan-path { display: flex; flex-direction: column; gap: 0; padding-left: 4px; }
.pp { display: flex; gap: 14px; align-items: center; padding-block: 8px; position: relative; }
.pp + .pp::before { content: ""; position: absolute; left: 19px; top: -10px; height: 20px; border-left: 3px dashed var(--line-dk); }
.pp > div { display: flex; flex-direction: column; }
.pp-n { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--ouro); color: var(--noite); font: 800 18px/1 var(--f-brand); border-bottom: 4px solid var(--ouro-dk); flex: none; }
.pw-top { display: flex; align-items: center; gap: 12px; }
.pw-top .deco { width: 84px; height: 84px; flex: none; }
.perks { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.perks li { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
.perks .ic { color: var(--ok); margin-top: 2px; stroke-width: 3; }
.tl { list-style: none; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 12px; border-left: 3px solid var(--line); margin-left: 8px; }
.tl li { position: relative; display: flex; flex-direction: column; font-size: 15px; }
.tl li::before { content: ""; position: absolute; left: -28px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line-dk); }
.tl li:first-child::before { background: var(--ouro); border-color: var(--ouro-dk); }

/* HUD e jornada */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 10px; background: var(--bg); border-bottom: 2px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.hud-trail { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 12px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; background: var(--surface); font-weight: 700; }
.hud-trail span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-r { display: flex; gap: 6px; }
.hud-i { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 0; background: none; border-radius: 12px; font: 800 17px/1 var(--f-brand); color: var(--muted); }
.hud-i .grao { fill: var(--bloq-dk); }
.hud-i.lit { color: var(--fg); } .hud-i.lit .grao { fill: var(--ouro); }
.note { padding: 12px 14px; border-radius: 14px; background: var(--soft); font-size: 15px; }
.risk { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.daily { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 2px solid var(--line); border-radius: 20px; background: var(--surface); }
.daily-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.daily-h h2 { font: 800 18px/1.2 var(--f-brand); }
.daily-h span { color: var(--muted); font-size: 14px; } .daily-h b { color: var(--fg); font-size: 16px; }
.boost { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ouro-dk); font-size: 14px; }
.boost .ic { width: 16px; height: 16px; fill: var(--ouro); stroke: var(--ouro-dk); }
.quests { list-style: none; padding: 8px 0 0; display: flex; flex-direction: column; gap: 12px; border-top: 2px dashed var(--line); }
.quests li { display: flex; flex-direction: column; gap: 6px; }
.q-t { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 600; }
.q-r { display: flex; align-items: center; gap: 10px; }
.q-r .reward, .q-r .claimed { width: 36px; height: 30px; display: grid; place-items: center; }
.q-r .claimed { color: var(--ok); }
.culto-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px; background: var(--surface); text-align: left; }
.culto-row > span:nth-child(2) { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.culto-row small { color: var(--muted); }
.cr-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--noite); color: var(--ouro); display: grid; place-items: center; flex: none; }
.chev { font-size: 28px; color: var(--muted); line-height: 1; }

.path { display: flex; flex-direction: column; gap: 26px; }
.banner { position: relative; display: flex; align-items: stretch; justify-content: space-between; gap: 10px; padding: 16px 16px 16px 18px; background: var(--noite); color: var(--pergaminho); border-radius: 20px; border-bottom: 6px solid var(--noite-dk); overflow: hidden; min-height: 96px; }
.banner > div { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.banner p { color: var(--ouro); font-size: 13px; font-weight: 700; }
.banner h3 { font: 800 19px/1.2 var(--f-brand); }
.banner small { opacity: .75; font-size: 13px; }
.banner-art { width: 120px; height: 80px; flex: none; align-self: flex-end; margin: -16px -16px -16px 0; }
.nodes { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 52px 6px; }
.deco-wrap { position: absolute; top: 34%; width: 78px; height: 78px; pointer-events: none; }
.deco-wrap.left { left: -6px; } .deco-wrap.right { right: -6px; }
.deco-wrap.left { left: 0; } .deco-wrap.right { right: 0; }
.deco { width: 100%; height: 100%; display: block; }
.node-w { position: relative; transform: translateX(var(--x)); display: flex; flex-direction: column; align-items: center; }
.node { position: relative; width: 74px; height: 68px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--ouro); color: var(--noite); border-bottom: 8px solid var(--ouro-dk); transition: transform .06s, border-bottom-width .06s; }
.node:active { transform: translateY(5px); border-bottom-width: 3px; }
.node .node-ic { width: 32px; height: 32px; stroke-width: 3; }
.node.done { background: var(--ouro); }
.node.cur { outline: 6px solid color-mix(in srgb, var(--ouro) 35%, transparent); outline-offset: 5px; }
.node.lock { background: var(--bloq); color: var(--bloq-dk); border-bottom-color: var(--bloq-dk); }
.node.chest { background: var(--surface); border: 3px solid var(--line); border-bottom: 8px solid var(--line-dk); }
.node.chest.ready { border-color: var(--ouro-dk); background: var(--mine); }
.node.chest.lock .node-vaso { opacity: .45; filter: grayscale(1); }
.node.chest.opened { opacity: .6; }
.node-vaso { width: 34px; height: 38px; }
.start-bubble { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 8px 14px; border-radius: 12px; background: var(--surface); border: 2px solid var(--line); color: var(--ouro-dk); font-weight: 800; font-size: 14px; letter-spacing: .03em; z-index: 2; }
.start-bubble::after { content: ""; position: absolute; left: 50%; top: 100%; width: 10px; height: 10px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translate(-50%, -5px) rotate(45deg); }
.start-bubble.low { bottom: auto; top: calc(100% + 10px); }
.start-bubble.low::after { top: auto; bottom: 100%; transform: translate(-50%, 5px) rotate(225deg); }
@media (prefers-reduced-motion: no-preference) { .start-bubble { animation: float 1.6s ease-in-out infinite; } }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
.pop { position: relative; z-index: 4; margin-top: 14px; width: min(300px, 80vw); padding: 16px; border-radius: 18px; background: var(--ouro); color: var(--noite); display: flex; flex-direction: column; gap: 6px; text-align: left; border-bottom: 5px solid var(--ouro-dk); transform: translateX(calc(var(--x) * -1)); }
.pop::before { content: ""; position: absolute; top: -9px; left: calc(50% + var(--x)); width: 18px; height: 18px; background: var(--ouro); transform: translateX(-50%) rotate(45deg); }
.pop b { font: 800 17px/1.25 var(--f-brand); }
.pop p { font-size: 14px; }
.pop .btn { margin-top: 6px; }
.pop.lock { background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; color: var(--fg); }
.pop.lock::before { background: var(--surface); border-left: 2px solid var(--line); border-top: 2px solid var(--line); }
.path-end { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding-top: 8px; }

/* Abas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; justify-content: center; background: var(--bg); border-top: 2px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }

    st.last = t; st.best = Math.max(st.best, st.count); up = true;

}

function ensureQuests() {
  const t = todayK();
  if (S.quests && S.quests.d === t) return;
  const h = hash(t), pool = QUEST_POOL.slice(), list = [pool.splice(0, 1)[0]];
  for (let i = 0; i < 2; i++) list.push(pool.splice((h >> (i * 5)) % pool.length, 1)[0]);
  S.quests = { d: t, list: list.map((q, i) => ({ id: q.id, n: q.ns[(h >> (i * 3 + 2)) % q.ns.length], p: 0, claimed: false })) };
}
const questDef = id => QUEST_POOL.find(q => q.id === id);

function leagueTable(week, dayIdx) {

  const rows = RIVAIS.map(n => {

    const base = 4 + (h % 28) + div * 5;
    const xp = Math.max(0, Math.floor(base * (dayIdx + 1) * (0.7 + ((h >> 8) % 60) / 100)));
    return { nome: n, xp };
  });
  rows.push({ nome: S.nome || 'Você', xp: weekXPFrom(week), me: true });
  return rows.sort((a, b) => b.xp - a.xp || (a.me ? -1 : 1));
}

/* Chuva de maná: animação de celebração */
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function rain(n) {
  if (reduceMotion()) return;
  const c = document.createElement('canvas'); c.className = 'rain'; document.body.appendChild(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr; const x = c.getContext('2d'); x.scale(dpr, dpr);
  const gs = Array.from({ length: n || 70 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, v: 2.2 + Math.random() * 3, r: Math.random() * 6, s: 0.6 + Math.random() * 0.8, w: (Math.random() - .5) * 0.06 }));
  const t0 = performance.now();
  (function f(t) {
    const el = t - t0; x.clearRect(0, 0, W, H);
    gs.forEach(g => {
      g.y += g.v; g.r += g.w; g.x += Math.sin((g.y + g.r * 40) / 40) * 0.6;
      x.save(); x.translate(g.x, g.y); x.rotate(g.r); x.globalAlpha = Math.max(0, 1 - Math.max(0, el - 1800) / 600);
      x.fillStyle = '#F2C14E'; x.beginPath(); x.ellipse(0, 0, 4 * g.s, 6.5 * g.s, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#D9A63A'; x.beginPath(); x.ellipse(1.4 * g.s, 1 * g.s, 2 * g.s, 4.5 * g.s, 0, 0, Math.PI * 2); x.fill();
      x.restore();
    });
    if (el < 2400) requestAnimationFrame(f); else c.remove();
  })(t0);
}
function countUp() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const end = Number(el.dataset.count), suf = el.dataset.suf || '';
    if (reduceMotion()) { el.textContent = end + suf; return; }
    const t0 = performance.now();
    (function f(t) { const p = Math.min(1, (t - t0) / 900); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))) + suf; if (p < 1) requestAnimationFrame(f); })(t0);
  });
}

  { nome: 'Débora', base: 6, rate: 3.1 }, { nome: 'Pr. Samuel', base: 9, rate: 3.4 },
  { nome: 'Lucas', base: 2, rate: 1.6 }, { nome: 'Raquel', base: 4, rate: 2.6 }, { nome: 'Tiago', base: 1, rate: 0.9 },
];
function makeGroup(nome, des) {
  const t = todayK();
  S.group = {
    nome, code: Math.random().toString(36).slice(2, 8).toUpperCase(), desafio: des, start: t, chapAtStart: S.chapters,
    feed: [
      { id: uid(), who: 'Pr. Samuel', d: addDays(t, -1), text: 'Começamos o desafio. Leiam com calma e postem o que Deus falar com vocês.', ref: '', amem: 4, comments: [] },
      { id: uid(), who: 'Débora', d: t, text: 'Li dois capítulos no ônibus hoje. Marcos 1 me lembrou que Jesus começou o ministério orando cedo.', ref: 'Marcos 1:35', amem: 3, comments: [] },
    ],
  };
}
function ranking() {
  const g = S.group, days = Math.max(0, diff(g.start, todayK())) + 1;
  const rows = MEMBROS.map(m => ({ nome: m.nome, caps: Math.floor(m.base + m.rate * (days - 1)), ex: true }));
  rows.push({ nome: S.nome || 'Você', caps: S.chapters - g.chapAtStart, me: true });
  return rows.sort((a, b) => b.caps - a.caps);
}
function postFeed(text, ref) {
  if (!S.group) return;
  S.group.feed.unshift({ id: uid(), who: S.nome || 'Você', me: true, d: todayK(), text, ref: ref || '', amem: 0, comments: [] });
}

    h += '</div></section>';

  return h + '</main>';
}

function vPop(t, i, st) {
  const l = t.licoes[i];
  if (st === 'lock') return '<div class="pop lock" role="dialog"><b>' + esc(l.titulo) + '</b><p>Complete as lições anteriores para liberar esta.</p></div>';
  return '<div class="pop" role="dialog"><b>' + esc(l.titulo) + '</b><p>' + l.ref + ' · lição ' + (i + 1) + ' de ' + t.licoes.length + '</p>' +
    (st === 'done' ? '<button class="btn wbtn" data-a="startLesson" data-i="' + i + '" data-r="1">' + icon('repetir', 'ic sm') + ' Revisar · +5 XP</button>' : '<button class="btn wbtn" data-a="startLesson" data-i="' + i + '">Começar · +15 XP</button>') + '</div>';
}

/* ---------- Construção dos exercícios ---------- */
function pickOthers(arr, exclude, n) {
  const seen = new Set([exclude]);
  return shuffle(arr).filter(x => { if (seen.has(x)) return false; seen.add(x); return true; }).slice(0, n);
}
const words = s => s.replace(/[.,;:"()?!]/g, '').split(/\s+/).filter(Boolean);
function buildSteps(t, i) {
  const l = t.licoes[i], all = TRILHAS.flatMap(x => x.licoes), pool = t.licoes.length >= 5 ? t.licoes : all;
  const steps = [{ k: 'leia' }];
  steps.push({ k: 'mc', q: 'Qual destes títulos resume ' + l.ref + '?', opts: shuffle([l.titulo, ...pickOthers(pool.map(x => x.titulo), l.titulo, 3)]), ans: l.titulo, exp: l.ctx });
  const cand = words(l.ctx).filter(w => w.length >= 5 && !STOP.has(w.toLowerCase()) && l.ctx.indexOf(w) > -1);
  if (cand.length) {
    const w = cand[Math.floor(Math.random() * cand.length)];
    const others = all.flatMap(x => words(x.ctx)).filter(x => x.length >= 5 && !STOP.has(x.toLowerCase()) && x.toLowerCase() !== w.toLowerCase() && !l.ctx.includes(x));
    const at = l.ctx.indexOf(w);
    steps.push({ k: 'fill', before: l.ctx.slice(0, at), after: l.ctx.slice(at + w.length), opts: shuffle([w, ...pickOthers(others, w, 3)]), ans: w });
  }
  const tw = l.titulo.split(' ');
  if (tw.length >= 3) {
    const extra = pickOthers(all.flatMap(x => x.titulo.split(' ')).filter(x => !tw.includes(x) && x.length > 2), null, 2);
    steps.push({ k: 'tiles', prompt: 'Monte o título desta lição', hint: l.ref, target: tw, bank: shuffle([...tw, ...extra].map((w, j) => ({ w, id: j }))) });
  }
  steps.push({ k: 'mc', q: 'Em que texto você encontra "' + l.titulo + '"?', opts: shuffle([l.ref, ...pickOthers(pool.map(x => x.ref), l.ref, 3)]), ans: l.ref });
  steps.push({ k: 'reflita' });
  return steps;
}
async function aiQuestions(L) {
  if (!SAMPLE || L.review) return;
  const l = trilha(L.id).licoes[L.idx];
  try {
    const r = await SAMPLE.json(REGRAS + '\n\nCrie 2 perguntas de múltipla escolha sobre fatos explícitos de ' + l.ref + ' (tema da lição: ' + l.titulo + '). Use só fatos que estão claramente no texto bíblico, sem interpretação que divide as igrejas. Opções curtas, no máximo 8 palavras. Responda só com JSON: [{"pergunta": "...", "opcoes": ["4 opções"], "correta": 0, "explicacao": "1 frase citando o versículo por referência"}]', { modelTier: 'quick' });
    if (ui.L !== L || L.phase !== 'steps' || !Array.isArray(r)) return;
    const qs = r.filter(q => q && q.pergunta && Array.isArray(q.opcoes) && q.opcoes.length >= 3 && q.opcoes[q.correta]).slice(0, 2)
      .map(q => ({ k: 'mc', q: String(q.pergunta), opts: shuffle(q.opcoes.map(String)), ans: String(q.opcoes[q.correta]), exp: q.explicacao ? String(q.explicacao) : '', ia: true }));
    if (!qs.length) return;
    const at = Math.max(L.i + 1, 2);
    L.steps.splice(Math.min(at, L.steps.length - 1), 0, qs[0]);
    if (qs[1]) L.steps.splice(L.steps.length - 2, 0, qs[1]);
    L.total += qs.length;
    renderLesson();
  } catch (e) { /* sem IA, segue com os exercícios prontos */ }
}

function startLesson(id, idx, review) {
  const t = trilha(id);
  ui.pop = null; ui.aiText = ''; ui.aiErr = '';
  const steps = buildSteps(t, idx);
  ui.L = { id, idx, review: !!review, steps, total: steps.length, i: 0, phase: 'steps', pick: null, built: [], checked: null, combo: 0, best: 0, right: 0, wrong: 0, t0: Date.now(), lido: false };
  render();
  aiQuestions(ui.L);
}

function vOfensivaUp() {

  const frase = n === 1 ? 'Primeiro dia colhido. O maná cai de novo amanhã.' : n < 7 ? 'Faltam ' + (7 - n) + ' dias para uma semana inteira.' : n % 7 === 0 ? 'Mais uma semana inteira na Palavra.' : 'O maná não se guardava, e você colheu de novo.';

}

function finishLesson() {
  const L = ui.L, t = trilha(L.id), l = t.licoes[L.idx];
  const nota = val('l-nota'); if (nota) S.notes[L.id + L.idx] = nota;
  const perfect = L.wrong === 0, acc = Math.round(L.right / Math.max(1, L.right + L.wrong) * 100);
  const secs = Math.round((Date.now() - L.t0) / 1000), tempo = Math.floor(secs / 60) + ':' + pad(secs % 60);
  let base = L.review ? 5 : 15;
  if (!L.review && perfect) base += 5;
  base += Math.min(5, Math.floor(L.best / 3));
  const boost = boostOn(), xp = addXP(base);
  let grains = 0, up = false;
  if (!L.review) {
    S.progress[L.id] = Math.max(S.progress[L.id] || 0, L.idx + 1);
    S.lessons++; if (perfect) { S.perfect++; bump('perfeita', 1); }
    bump('licoes', 1); grains = perfect ? 8 : 5; S.grains += grains;
    up = study(l.caps);
    if (S.group) postFeed(nota ? nota.slice(0, 280) : 'Colhi a porção de hoje: ' + l.titulo + '.', l.ref);
    if (isDone(L.id)) setTimeout(() => toast('Meta concluída: ' + t.nome), 1500);
  } else { up = study(0); }
  S.bestCombo = Math.max(S.bestCombo, L.best);
  checkAch(); save();
  L.result = { xp, acc, tempo, perfect, grains, boost, up };
  L.phase = 'fim';
  render(); SND.fim(); rain(80); countUp();
}

  { k: 'denom', t: 'Qual é a sua igreja ou denominação?', fala: 'Prazer, eu sou o Mani! Primeiro, me conta: qual é a sua igreja?', opts: DENOMINACOES.map(d => d[0]) },

  { k: 'minutos', t: 'Quanto tempo você tem por dia?', fala: 'Quanto tempo por dia você quer separar?', opts: [[5, '5 minutos · leve'], [10, '10 minutos · firme'], [20, '20 minutos · intenso']] },
  { k: 'trilhas', t: 'O que você quer aprender este ano?', fala: 'Agora a parte boa: o que você quer aprender este ano? Escolha até 3.', multi: true },
  { k: 'celula', t: 'Você participa de célula ou EBD?', fala: 'Você participa de célula ou de EBD?', opts: ['Célula', 'EBD', 'Os dois', 'Nenhum dos dois'] },
  { k: 'versao', t: 'Qual versão da Bíblia você usa?', fala: 'Qual Bíblia você usa? Eu indico o texto e você lê nela.', opts: ['ARA', 'ARC', 'NVI', 'NAA', 'NTLH', 'Outra ou não sei'] },
  { k: 'horario', t: 'Qual horário você prefere para o lembrete?', fala: 'Que horas eu te lembro da sua porção?', opts: ['6h', '7h', '12h', '19h', '21h'] },
];
const goalFor = m => ({ 5: 20, 10: 30, 20: 50 }[m] || 30);

function vOnboarding() {
  const s = S.step;
  if (s === 0) return '<main class="onb-hero"><div class="sky">' + ART.banner() + '</div>' + ART.mani('mani hero', 'feliz') +
    '<div class="onb-c"><h1 class="brand">manna</h1><p class="lead">Sua porção diária da Palavra</p><p class="body-l">Uma jornada pela Bíblia com lições curtas, ofensiva, liga semanal e os amigos da sua igreja.</p>' +
    '<button class="btn" data-a="next">Montar meu plano</button><p class="fine">Leva 1 minuto. Versão de teste: nada é cobrado.</p></div></main>';
  if (s >= 1 && s <= QUIZ.length) return vQuiz(QUIZ[s - 1], s);
  if (s === QUIZ.length + 1) return vResultado();
  if (s === QUIZ.length + 2) return vPaywall();
  return vConvite();
}
function quizHead(s) {
  return '<div class="qhead"><button class="iconbtn" data-a="back" aria-label="Voltar">' + icon('voltar') + '</button><span class="bar thick"><i style="width:' + (s / QUIZ.length * 100) + '%"></i></span></div>';
}
function vQuiz(q, s) {
  let h = '<main class="screen">' + quizHead(s) + '<div class="speak">' + ART.mani('mani sm', s === 5 ? 'festa' : 'feliz') + '<div class="bubble">' + q.fala + '</div></div><h2 class="sr">' + q.t + '</h2>';
  if (q.multi) {
    const sel = S.quiz.trilhas;
    ['Livro', 'Personagem', 'Tema'].forEach(tp => {
      h += '<h3 class="grp">' + { Livro: 'Um livro', Personagem: 'Um personagem', Tema: 'Um tema' }[tp] + '</h3><div class="cards2">';
      TRILHAS.filter(t => t.tipo === tp).forEach(t => {
        const i = sel.indexOf(t.id);
        h += '<button class="pick' + (i > -1 ? ' on' : '') + '" data-a="pickTrail" data-id="' + t.id + '" aria-pressed="' + (i > -1) + '">' + (i > -1 ? '<em class="ord">' + (i + 1) + '</em>' : '') + '<b>' + t.nome + '</b><small>' + t.desc + '</small><span class="muted tnum">' + plural(t.licoes.length, 'lição', 'lições') + '</span></button>';
      });
      h += '</div>';
    });
    h += '<div class="sticky-cta"><button class="btn" data-a="next"' + (sel.length ? '' : ' disabled') + '>Continuar</button></div>';
  } else {
    h += '<div class="choices">';
    q.opts.forEach(o => {
      const v = Array.isArray(o) ? o[0] : o, label = Array.isArray(o) ? o[1] : o;
      h += '<button class="choice' + (S.quiz[q.k] === v ? ' sel' : '') + '" data-a="answer" data-k="' + q.k + '" data-v="' + esc(v) + '">' + esc(label) + '</button>';
    });
    h += '</div>';
  }
  return h + '</main>';
}
function vResultado() {
  const q = S.quiz, first = trilha(q.trilhas[0]);
  const des = (q.celula === 'Célula' || q.celula === 'Os dois') ? 'Chame sua célula para "Evangelhos em 30 dias".' : 'Faça 7 dias seguidos e ganhe a medalha Fiel.';
  let h = '<main class="screen"><div class="speak">' + ART.mani('mani sm', 'festa') + '<div class="bubble">Pronto! Montei o seu plano. Começa hoje, ' + fmt(todayK()) + '.</div></div><h1 class="h1">Seu plano para 2027</h1>';
  h += '<section class="plan-path">';
  q.trilhas.forEach((id, i) => {
    const t = trilha(id);
    h += '<div class="pp"><span class="pp-n">' + (i + 1) + '</span><div><b>' + t.nome + '</b><small class="muted">' + plural(t.licoes.length, 'lição', 'lições') + ' · até ' + fmt(planEnd(id), { day: 'numeric', month: 'short', year: 'numeric' }) + '</small></div></div>';
  });
  h += '</section><div class="stats3"><div><b class="tnum">' + goalFor(q.minutos) + '</b><span>XP por dia</span></div><div><b class="tnum">' + q.minutos + '</b><span>minutos</span></div><div><b>' + (q.horario || '7h') + '</b><span>lembrete</span></div></div>';
  h += '<section class="card"><h3>Primeiro desafio</h3><p>' + des + '</p></section><section class="card"><h3>Sua primeira lição</h3><p><b>' + first.licoes[0].ref + '</b>: ' + first.licoes[0].titulo + '</p></section>';
  return h + '<div class="sticky-cta"><button class="btn" data-a="next">Começar meu plano</button></div></main>';
}
function planEnd(id) {
  let acc = 0; const rit = { 5: 5, 10: 6, 20: 7 }[S.quiz.minutos || 10];
  for (const t of S.quiz.trilhas) { acc += trilha(t).licoes.length - doneCount(t); if (t === id) break; }
  return addDays(todayK(), Math.ceil(acc / rit * 7));
}
function vPaywall() {

    '<ul class="perks"><li>' + icon('check', 'ic sm') + 'Jornada completa com todas as metas</li><li>' + icon('check', 'ic sm') + 'Culto de domingo virando estudo da semana</li><li>' + icon('check', 'ic sm') + 'Dúvidas com versículos e as visões das tradições</li><li>' + icon('check', 'ic sm') + 'Liga semanal, grupos e protetor de ofensiva</li></ul><div class="choices">';

  });
  h += '</div><ol class="tl"><li><b>Hoje</b><span>Acesso completo. Você paga R$ 0,00.</span></li><li><b>' + fmt(addDays(todayK(), 5)) + '</b><span>Avisamos que o teste está acabando.</span></li><li><b>' + fmt(addDays(todayK(), 7)) + '</b><span>Começa a cobrança de ' + preco + ', se você não cancelar.</span></li></ol>' +
    '<div class="sticky-cta"><button class="btn" data-a="trial">Começar 7 dias grátis</button><p class="fine center-t">Versão de teste: nenhum pagamento é pedido nem cobrado.</p></div></main>';
  return h;
}
function vConvite() {
  return '<main class="screen"><div class="speak">' + ART.mani('mani sm', 'feliz') + '<div class="bubble">Quem lê junto não para. Bora chamar o pessoal da igreja?</div></div><h1 class="h1">Estude com a sua igreja</h1>' + vGroupForms(true) + '<button class="btn ghost" data-a="finish">Agora não</button></main>';

/* ---------- Dúvidas ---------- */
function vDuvidas() {
  const f = ui.filtro.toLowerCase();
  const list = DUVIDAS.filter(d => !f || (d.q + ' ' + d.cat).toLowerCase().includes(f));
  const cats = [...new Set(DUVIDAS.map(d => d.cat))];
  let h = '<main class="screen">' + pageHead('Dúvidas', 'O que dá vergonha de perguntar ao pastor, com versículos e as visões das tradições.', ART.deco.tabuas);
  h += '<form class="form ask" data-f="duvida"><div class="speak small">' + ART.mani('mani xs', 'pensa') + '<div class="bubble">Pode perguntar. Ninguém vai ficar sabendo.</div></div><textarea id="d-q" rows="2" maxlength="300" aria-label="Sua pergunta" placeholder="Ex.: Posso ser padrinho numa igreja católica?"></textarea>' +
    (SAMPLE ? busyBtn('Perguntar') : '<p class="fine">' + (aiChecked ? 'A pergunta livre usa IA e não está disponível aqui. A biblioteca abaixo funciona normalmente.' : 'Verificando a IA…') + '</p>') + '</form>';
  if (S.perguntas.length) {
    h += '<section class="sec"><h2>Suas perguntas</h2><ul class="list">';
    S.perguntas.forEach(p => { h += '<li><button data-a="open" data-ov="duvida" data-id="' + p.id + '"><b>' + esc(p.q) + '</b></button></li>'; });
    h += '</ul></section>';
  }
  h += '<section class="sec"><div class="sec-h"><h2>Biblioteca</h2><span class="muted tnum">' + S.duvidasLidas.length + ' de ' + DUVIDAS.length + ' estudadas</span></div>' +
    '<input id="d-filtro" class="search" type="search" placeholder="Buscar: vinho, dízimo, namoro…" value="' + esc(ui.filtro) + '" aria-label="Buscar dúvidas">';
  cats.forEach(c => {
    const ds = list.filter(d => d.cat === c); if (!ds.length) return;
    h += '<h3 class="grp">' + c + '</h3><ul class="list">';
    ds.forEach(d => { const lida = S.duvidasLidas.includes(d.id); h += '<li><button data-a="open" data-ov="duvida" data-id="' + d.id + '" class="dq"><span class="dq-dot' + (lida ? ' on' : '') + '">' + (lida ? icon('check', 'ic xs') : '') + '</span><b>' + d.q + '</b>' + (lida ? '' : '<span class="xp-tag">+5 XP</span>') + '</button></li>'; });

}

function render() {

function renderToast() {

  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = ui.toast; t.hidden = !ui.toast;
}
function go(fn) { fn(); save(); render(); }
function keep() { render.keep = true; render(); }
function openOv(type, id) { ui.ov = { type, id }; ui.aiErr = ''; ui.busy = false; window.scrollTo(0, 0); render(); }

/* ---------- Ações ---------- */
const A = {
  next() {
    if (ui.L) return lessonNext();
    if (S.step === QUIZ.length + 1 && !S.plano) S.plano = 'anual';
    go(() => { S.step++; }); window.scrollTo(0, 0);
  },
  back() { go(() => { S.step = Math.max(0, S.step - 1); }); },
  answer(el) {
    const k = el.dataset.k; let v = el.dataset.v;
    if (k === 'minutos') { v = Number(v); S.goal = goalFor(v); }
    S.quiz[k] = v;
    if (k === 'denom') { const d = DENOMINACOES.find(x => x[0] === v); S.quiz.tradicao = d ? d[1] : null; }
    render(); setTimeout(() => A.next(), 220);
  },
  pickTrail(el) {
    const id = el.dataset.id, a = S.quiz.trilhas, i = a.indexOf(id);
    if (i > -1) a.splice(i, 1); else if (a.length < 3) a.push(id); else toast('Escolha até 3 metas agora. Dá para adicionar mais depois.');
    save(); keep();
  },
  plan(el) { S.plano = el.dataset.id; save(); keep(); },
  trial() { go(() => { S.trialStart = todayK(); S.step++; }); window.scrollTo(0, 0); },
  finish() { go(() => { S.onboarded = true; ui.tab = 'jornada'; }); window.scrollTo(0, 0); },
  tab(el) { ui.tab = el.dataset.tab; ui.aiErr = ''; ui.pop = null; ui.confirmReset = false; window.scrollTo(0, 0); render(); },
  open(el) { openOv(el.dataset.ov, el.dataset.id); },
  close() { ui.ov = null; if (aiCtl) aiCtl.abort(); ui.busy = false; window.scrollTo(0, 0); render(); },
  dismiss() { ui.notice = ''; keep(); },
  sheet(el) { ui.sheet = el.dataset.s; keep(); },
  closeSheet() { ui.sheet = null; keep(); },
  closeModal() { ui.modal = null; keep(); },
  goTrail(el) { S.cur = el.dataset.id; ui.sheet = null; ui.pop = null; save(); window.scrollTo(0, 0); render(); },
  addMeta(el) {
    if (S.quiz.trilhas.length >= 5) { toast('Você já tem 5 metas.'); return; }
    if (!S.quiz.trilhas.includes(el.dataset.id)) S.quiz.trilhas.push(el.dataset.id);
    toast('Meta adicionada: ' + trilha(el.dataset.id).nome); save(); keep();
  },
  pop(el) {
    const i = Number(el.dataset.i);
    ui.pop = ui.pop === i ? null : i; keep();
  },
  startLesson(el) { startLesson(curTrail(), Number(el.dataset.i), el.dataset.r === '1'); window.scrollTo(0, 0); },
  chest(el) {
    const id = curTrail(), u = Number(el.dataset.u), ck = id + ':' + u;
    if (S.chests[ck]) { toast('Você já abriu este vaso.'); return; }
    if (doneCount(id) < Math.min(trilha(id).licoes.length, (u + 1) * UNIT)) { toast('Complete as lições da unidade para abrir o vaso.'); return; }
    const g = 15 + hash(ck) % 16; S.chests[ck] = true; S.grains += g; save();
    ui.modal = { art: ART.deco.vasoGrande, t: 'Vaso de maná aberto', p: 'Você ganhou ' + g + ' grãos de maná. Use na loja para proteger sua ofensiva.' };
    SND.vaso(); keep(); rain(40);
  },
  claim(el) {
    const q = S.quests.list[Number(el.dataset.i)]; if (!q || q.claimed || q.p < q.n) return;
    q.claimed = true; S.grains += 10; SND.vaso(); toast('+10 grãos de maná'); save(); keep();
  },
  buy(el) {
    const id = el.dataset.id, preco = { protetor: 50, dobro: 60, recuperar: 150 }[id];
    if (S.grains < preco) return;
    S.grains -= preco;
    if (id === 'protetor') { S.protetores = Math.min(2, S.protetores + 1); toast('Protetor guardado.'); }
    if (id === 'dobro') { S.boostUntil = Date.now() + 15 * 60000; toast('XP em dobro por 15 minutos.'); }
    if (id === 'recuperar' && S.lost) { const c = S.lost.count + (S.streak.count ? 1 : 0); S.streak.count = c; S.streak.last = S.streak.count > S.lost.count ? todayK() : addDays(todayK(), -1); S.streak.best = Math.max(S.streak.best, c); S.lost = null; ui.notice = ''; toast('Ofensiva de ' + plural(c, 'dia', 'dias') + ' recuperada.'); }
    SND.vaso(); save(); keep();
  },
  /* Lição */
  pick(el) { const L = ui.L; if (L.checked) return; L.pick = el.dataset.v; renderLesson(); },
  tile(el) { const L = ui.L; if (L.checked) return; L.built.push(Number(el.dataset.id)); renderLesson(); },
  untile(el) { const L = ui.L; if (L.checked) return; L.built = L.built.filter(x => x !== Number(el.dataset.id)); renderLesson(); },
  checkAns() {
    const L = ui.L, s = L.steps[L.i];
    const ok = s.k === 'tiles' ? L.built.map(id => s.bank.find(x => x.id === id).w).join(' ') === s.target.join(' ') : L.pick === s.ans;
    L.checked = ok ? 'ok' : 'bad';
    if (ok) { L.right++; L.combo++; L.best = Math.max(L.best, L.combo); bump('combo', L.combo); SND.certo(); }
    else { L.wrong++; L.combo = 0; SND.errado(); if (!s.retry) L.steps.splice(L.steps.length - 1, 0, Object.assign({}, s, { retry: true, opts: s.opts ? shuffle(s.opts) : s.opts, bank: s.bank ? shuffle(s.bank) : s.bank })); }
    renderLesson();
  },
  explain() {
    const L = ui.L, l = trilha(L.id).licoes[L.idx];
    ui.busy = true; ui.aiErr = ''; ui.aiText = ''; renderLesson();
    aiCtl = new AbortController();
    SAMPLE(REGRAS + '\n\nExplique ' + l.ref + ' para um crente que vai ler o texto hoje. Tema da lição: ' + l.titulo + '. Em 2 parágrafos curtos: o contexto (quem, para quem, quando) e a ideia central. Depois, uma frase de aplicação. Texto corrido, sem títulos, sem listas, sem markdown.', {
      signal: aiCtl.signal, modelTier: 'quick', onText: ({ text }) => { ui.aiText = text; if (ui.L) renderLesson(); },
    }).catch(e => { ui.aiText = e.text || ui.aiText; if (e.code !== 'cancelled') ui.aiErr = aiMsg(e); })
      .finally(() => { ui.busy = false; if (ui.L) renderLesson(); });
  },
  stopAi() { if (aiCtl) aiCtl.abort(); },
  finishLesson() { finishLesson(); },
  afterFim() { const L = ui.L; if (L.result.up && !L.review) { L.phase = 'ofensiva'; renderLesson(); countUp(); if (S.streak.count > 1) rain(50); } else A.closeLesson(); },
  closeLesson() { ui.L = null; ui.aiText = ''; ui.busy = false; window.scrollTo(0, 0); render(); },
  lessonExit() { const L = ui.L; if (L.i === 0 && !L.lido) return A.closeLesson(); L.prev = L.phase; L.phase = 'sair'; renderLesson(); },
  lessonStay() { ui.L.phase = 'steps'; renderLesson(); },
  lessonQuit() { if (aiCtl) aiCtl.abort(); A.closeLesson(); },
  /* Domingo */
  dom(el) { ui.domMode = el.dataset.m; ui.aiErr = ''; keep(); },
  ebdModo(el) { ui.ebdModo = el.dataset.m; keep(); },
  cultoDia(el) {
    const c = S.cultos.find(x => x.id === el.dataset.id), i = Number(el.dataset.i);
    if (c.feitos.includes(i)) return;
    c.feitos.push(i); study(1); addXP(10);
    toast(c.feitos.length === 5 ? 'Estudo da semana concluído.' : 'Dia feito. Ofensiva: ' + plural(S.streak.count, 'dia', 'dias') + '.');
    save(); keep();
  },
  shareCulto(el) {
    const c = S.cultos.find(x => x.id === el.dataset.id);
    postFeed('Compartilhei o estudo do culto "' + c.tema + '". ' + (c.study.resumo || '').slice(0, 180), (c.study.versiculos || []).slice(0, 2).join('; '));
    toast('Estudo compartilhado no grupo.'); save(); keep();
  },
  delCulto(el) { S.cultos = S.cultos.filter(x => x.id !== el.dataset.id); save(); A.close(); },
  delEbd(el) { S.ebds = S.ebds.filter(x => x.id !== el.dataset.id); save(); A.close(); },
  /* Liga e grupo */
  ligaMode(el) { ui.ligaMode = el.dataset.m; keep(); },
  gmode(el) { ui.groupMode = el.dataset.m; keep(); },
  amem(el) { const p = S.group.feed.find(x => x.id === el.dataset.id); p.amei = !p.amei; p.amem += p.amei ? 1 : -1; save(); keep(); },
  cmt(el) { ui.cmt = ui.cmt === el.dataset.id ? null : el.dataset.id; keep(); setTimeout(() => $('cmt-txt') && $('cmt-txt').focus(), 0); },
  leaveGroup() { if (ui.confirmLeave) { ui.confirmLeave = false; S.group = null; save(); keep(); toast('Você saiu do grupo.'); } else { ui.confirmLeave = true; toast('Toque de novo em "Sair do grupo" para confirmar.'); setTimeout(() => { ui.confirmLeave = false; }, 4000); } },
  copy(el) {
    const t = el.dataset.t;
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copiado.'); } catch (e) { toast('Selecione e copie o texto.'); } ta.remove(); };
    try { navigator.clipboard.writeText(t).then(() => toast('Copiado.'), fallback); } catch (e) { fallback(); }
  },
  /* Perfil e teste */
  nextDay() { S.offset++; ui.notice = ''; checkStreak(); checkLeague(); ensureQuests(); save(); toast('Agora é ' + fmt(todayK(), { weekday: 'long', day: 'numeric', month: 'long' }) + '.'); keep(); },
  giveGrains() { S.grains += 100; save(); toast('+100 grãos para testar a loja.'); keep(); },
  redoQuiz() { go(() => { S.onboarded = false; S.step = 1; }); window.scrollTo(0, 0); },
  askReset() { ui.confirmReset = true; keep(); },
  cancelReset() { ui.confirmReset = false; keep(); },
  reset() { try { localStorage.removeItem(KEY); } catch (e) {} S = fresh(); Object.assign(ui, { tab: 'jornada', ov: null, L: null, confirmReset: false, notice: '', sheet: null, modal: null }); save(); window.scrollTo(0, 0); render(); },
};

function lessonNext() {
  const L = ui.L, s = L.steps[L.i];
  if (s.k === 'leia') { if (!L.lido) return; }
  L.i++; L.pick = null; L.built = []; L.checked = null;
  renderLesson(); window.scrollTo(0, 0);
}

const F = {
  async culto() {
    const c = { id: uid(), tema: val('c-tema'), versiculos: val('c-vers'), pregador: val('c-preg'), data: val('c-data') || lastSunday(), igreja: val('c-igreja'), link: val('c-link'), notas: val('c-notas'), feitos: [] };
    if (!c.tema) { toast('Digite o tema da pregação.'); return; }
    if (c.link && !/^https?:\/\//i.test(c.link)) c.link = '';
    S.lastIgreja = c.igreja; ui.busy = true; ui.aiErr = ''; keep();
    try { c.study = await genStudy(c); }
    catch (e) { ui.busy = false; if (e.code === 'cancelled') { keep(); return; } ui.aiErr = aiMsg(e) + ' Montei com o roteiro padrão.'; c.study = localStudy(c); }
    ui.busy = false; S.cultos.unshift(c); addXP(20); save(); openOv('culto', c.id);
  },
  async ebd() {
    const e = { id: uid(), tema: val('e-tema'), textos: val('e-textos'), modo: ui.ebdModo === 'professor' ? 'professor' : 'aluno', data: todayK() };
    if (!e.tema) { toast('Digite o tema da lição.'); return; }
    ui.busy = true; ui.aiErr = ''; keep();
    try { e.prep = await genEbd(e); }
    catch (err) { ui.busy = false; if (err.code === 'cancelled') { keep(); return; } ui.aiErr = aiMsg(err) + ' Montei com o roteiro padrão.'; e.prep = localEbd(e); }
    ui.busy = false; S.ebds.unshift(e); addXP(15); save(); openOv('ebd', e.id);
  },
  async duvida() {
    const q = val('d-q'); if (q.length < 6) { toast('Escreva a sua pergunta.'); return; }
    ui.busy = true; ui.aiErr = ''; keep();
    try { const d = await genDuvida(q); S.perguntas.unshift(d); addXP(5); bump('duvida', 1); checkAch(); save(); ui.busy = false; openOv('duvida', d.id); }
    catch (e) { ui.busy = false; if (e.code !== 'cancelled') ui.aiErr = aiMsg(e); keep(); }
  },
  gcriar() {
    const nome = val('g-nome'); if (!nome) { toast('Dê um nome ao grupo.'); return; }
    S.nome = val('g-eu') || S.nome; makeGroup(nome, val('g-des') || 'evangelhos30');
    S.onboarded = true; ui.tab = 'liga'; ui.ligaMode = 'grupo'; ui.groupMode = null; save(); window.scrollTo(0, 0); render(); toast('Grupo criado. Agora convide pelo WhatsApp.');
  },
  gentrar() {
    const code = val('g-code').toUpperCase(); if (code.length < 4) { toast('Digite o código do convite.'); return; }
    S.nome = val('g-eu') || S.nome; makeGroup('Célula Esperança', 'evangelhos30'); S.group.code = code;
    S.onboarded = true; ui.tab = 'liga'; ui.ligaMode = 'grupo'; ui.groupMode = null; save(); window.scrollTo(0, 0); render(); toast('Você entrou num grupo de exemplo.');
  },
  checkin() {
    const caps = Math.max(0, Math.min(50, parseInt(val('ck-caps'), 10) || 0)), ref = val('ck-ref'), txt = val('ck-txt');
    if (!caps && !txt) { toast('Informe os capítulos ou escreva uma reflexão.'); return; }
    if (caps) { study(caps); addXP(10 * caps); }
    postFeed(txt || ('Li ' + plural(caps, 'capítulo', 'capítulos') + ' hoje.'), ref);
    toast(caps ? 'Leitura marcada. Ofensiva: ' + plural(S.streak.count, 'dia', 'dias') + '.' : 'Reflexão postada.'); save(); keep();
  },
  cmt(form) {
    const t = val('cmt-txt'); if (!t) return;
    S.group.feed.find(x => x.id === form.dataset.id).comments.push({ who: S.nome || 'Você', text: t }); ui.cmt = null; save(); keep();
  },
  ajustes() {
    S.nome = val('p-nome'); S.goal = Number(val('p-goal')) || 30; S.quiz.horario = val('p-hor'); S.sound = !!($('p-som') && $('p-som').checked);
    save(); toast('Ajustes salvos.'); keep();
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn || el.tagName === 'A') return;
  e.preventDefault(); fn(el);
});
document.addEventListener('keydown', e => {
  if (ui.L && !e.target.matches('textarea,input')) {
    const L = ui.L, s = L.steps[L.i];
    if (s && s.k === 'mc' && !L.checked && /^[1-4]$/.test(e.key) && s.opts[Number(e.key) - 1]) { L.pick = s.opts[Number(e.key) - 1]; renderLesson(); }
    if (e.key === 'Enter') { const b = document.querySelector('.lfoot .btn:not([disabled])'); if (b) { e.preventDefault(); b.click(); } }
  }
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target.dataset.f; if (F[f]) F[f](e.target); });
document.addEventListener('input', e => {
  if (e.target.id === 'd-filtro') {
    ui.filtro = e.target.value; const pos = e.target.selectionStart; keep();
    const n = $('d-filtro'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} }
  }
  if (e.target.id === 'l-nota' && ui.L) { S.notes[ui.L.id + ui.L.idx] = e.target.value; save(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'l-lido' && ui.L) { ui.L.lido = e.target.checked; const b = document.querySelector('.lfoot .btn'); if (b) b.disabled = !ui.L.lido; }
});

/* Abrir uma dúvida conta como estudada */
const _openOv = openOv;
openOv = function (type, id) {
  if (type === 'duvida' && DUVIDAS.some(d => d.id === id) && !S.duvidasLidas.includes(id)) { S.duvidasLidas.push(id); addXP(5); bump('duvida', 1); checkAch(); save(); }
  _openOv(type, id);
};

ensureQuests(); checkStreak(); checkLeague(); save();
render(); renderToast();

</script>
